 "Xác suất tại một điểm của biến liên tục", "difficulty": "easy", "question": "Nếu X là một biến ngẫu nhiên LIÊN TỤC có hàm mật độ xác suất f(x), xác suất để X nhận chính xác một giá trị cụ thể P(X = c) bằng bao nhiêu?", "options": ["A. f(c)", "B. 0", "C. 1", "D. 0.5"], "correct": [1], "explanation": "Với biến ngẫu nhiên liên tục, xác suất tại một điểm đơn lẻ bất kỳ luôn bằng 0 vì diện tích tích phân trên một điểm có độ rộng bằng 0: P(X = c) = ∫_c^c f(x) dx = 0.", "multiple": false}, {"id": "w07_q003", "week": 7, "topic": "Phân phối Chuẩn hóa (Z-score)", "difficulty": "easy", "question": "Cho X tuân theo phân phối chuẩn N($\\mu$,$\\sigma^2$). Biến ngẫu nhiên chuẩn hóa Z = (X -$\\mu$) /$\\sigma$ tuân theo phân phối nào?", "options": ["A. N(0, 1) - Phân phối chuẩn tắc (Standard Normal)", "B. N(1, 0)", "C. Phân phối Đều U(0, 1)", "D. Phân phối t Student"], "correct": [0], "explanation": "Chuẩn hóa z-score trừ đi kỳ vọng $\\mu$ và chia cho độ lệch chuẩn$\\sigma$ sẽ biến đổi phân phối chuẩn bất kỳ thành phân phối chuẩn tắc N(0, 1) với mean = 0 và variance = 1.", "multiple": false}, {"id": "w07_q004", "week": 7, "topic": "Quan hệ Phương sai và Kỳ vọng", "difficulty": "easy", "question": "Công thức tính phương sai $Var(X)$ qua các mômen $E(X)$ và E($X^2$) là gì?", "options": ["A. $Var(X)$ = E($X^2$) - $[E(X)]^2$", "B. $Var(X)$ = $[E(X)]^2$ - E($X^2$)", "C. $Var(X)$ = E($X^2$) + $[E(X)]^2$", "D. $Var(X)$ = $E(X)$ / 2"], "correct": [0], "explanation": "Đẳng thức cơ bản: $Var(X)$ = E[(X - $\\mu$)^{2}] = E($X^2$) - $[E(X)]^2$.", "multiple": false}, {"id": "w07_q005", "week": 7, "topic": "Định lý Giới hạn Trung tâm (CLT)", "difficulty": "easy", "question": "Định lý Giới hạn Trung tâm (CLT) khẳng định rằng khi kích thước mẫu n đủ lớn, phân phối của TRUNG BÌNH MẪU $\\bar{X}_{n}$ sẽ tiến gần về phân phối gì?", "options": ["A. Phân phối Đều", "B. Phân phối Chuẩn (Normal distribution)", "C. Phân phối Poisson", "D. Phân phối Nhị thức"], "correct": [1], "explanation": "CLT khẳng định: dù phân phối gốc của quần thể có hình dạng gì (miễn là có kỳ vọng và phương sai hữu hạn), phân phối của trung bình mẫu (hoặc tổng) sẽ xấp xỉ phân phối chuẩn khi n đủ lớn.", "multiple": false}, {"id": "w07_q006", "week": 7, "topic": "Kỳ vọng của phân phối Bernoulli", "difficulty": "easy", "question": "Cho biến ngẫu nhiên Bernoulli X ~ Bern(p). Kỳ vọng $E(X)$ và phương sai $Var(X)$ lần lượt là gì?", "options": ["A. $E(X)$ = p, $Var(X)$ = p*(1 - p)", "B. $E(X)$ = 1, $Var(X)$ = p", "C. $E(X)$ = $p^2$, $Var(X)$ = p", "D. $E(X)$ = p*(1 - p), $Var(X)$ = p"], "correct": [0], "explanation": "$E(X)$ = 0*(1-p) + 1*p = p. $Var(X)$ = E($X^2$) - $[E(X)]^2$ = p - $p^2$ = p(1 - p).", "multiple": false}, {"id": "w07_q007", "week": 7, "topic": "Hàm mật độ xác suất (PDF)", "difficulty": "easy", "question": "Diện tích dưới đường cong hàm mật độ xác suất f(x) của một biến ngẫu nhiên liên tục trên toàn bộ trục số (-∞, +∞) luôn bằng bao nhiêu?", "options": ["A. 0", "B. 1", "C. +∞", "D. Phụ thuộc vào phương sai"], "correct": [1], "explanation": "Tổng xác suất của toàn bộ không gian mẫu luôn bằng 1, do đó tích phân ∫_{-∞}^{+∞} f(x) dx = 1.", "multiple": false}, {"id": "w07_q008", "week": 7, "topic": "Quy tắc 68-95-99.7", "difficulty": "easy", "question": "Đối với một biến ngẫu nhiên tuân theo phân phối chuẩn N($\\mu$,$\\sigma^2$), xác suất để X nằm trong khoảng [$\\mu$-$\\sigma$,$\\mu$+$\\sigma$] là xấp xỉ bao nhiêu?", "options": ["A. 50%", "B. 68%", "C. 95%", "D. 99.7%"], "correct": [1], "explanation": "Quy tắc 68-95-99.7: khoảng ±1$\\sigma$ chứa ~68.3% diện tích xác suất.", "multiple": false}, {"id": "w07_q009", "week": 7, "topic": "Phương sai của hằng số", "difficulty": "easy", "question": "Phương sai của một hằng số c ($Var(c))$ luôn bằng bao nhiêu?", "options": ["A. c", "B. 0", "C. $c^2$", "D. 1"], "correct": [1], "explanation": "Hằng số không có sự biến thiên ngẫu nhiên nên phương sai của nó bằng 0: $Var(c)$ = 0.", "multiple": false}, {"id": "w07_q010", "week": 7, "topic": "Phương sai của biến đổi tuyến tính", "difficulty": "medium", "question": "Cho biến ngẫu nhiên X có $Var(X)$ = 4. Phương sai và độ lệch chuẩn của biến Y = -5X + 10 lần lượt là bao nhiêu?", "options": ["A. $Var(Y)$ = 100, $SD(Y)$ = 10", "B. $Var(Y)$ = -20, $SD(Y)$ = -10", "C. $Var(Y)$ = 20, $SD(Y)$ = 4.47", "D. $Var(Y)$ = 100, $SD(Y)$ = -10"], "correct": [0], "explanation": "$Var(-5X + 10)$ = $ $(-5)^2$ $ * $Var(X)$ = 25 * 4 = 100. $SD(Y)$ = |-5| * $SD(X)$ = 5 * 2 = 10.", "multiple": false}, {"id": "w07_q011", "week": 7, "topic": "Phương sai của hiệu hai biến độc lập", "difficulty": "medium", "question": "Cho hai biến ngẫu nhiên ĐỘC LẬP X và Y có $Var(X)$ = 9 và $Var(Y)$ = 16. Phương sai của hiệu $Var(X - Y)$ bằng bao nhiêu?", "options": ["A. 9 - 16 = -7", "B. 9 + 16 = 25", "C. $\\sqrt{9^2 + 16^2}$", "D. 7"], "correct": [1], "explanation": "Khi X và Y độc lập: $Var(X - Y)$ = $Var(X + (-1)Y)$ = $Var(X) + (-1)^2 \\cdot Var(Y)$ = $Var(X) + Var(Y)$ = 9 + 16 = 25. Phương sai luôn cộng dồn sự bất định, không bao giờ trừ!", "multiple": false}, {"id": "w07_q012", "week": 7, "topic": "Kỳ vọng và Phương sai của Nhị thức", "difficulty": "medium", "question": "Cho X ~ Bin($n = 100$, $p = 0.2$). Kỳ vọng $E(X)$ và độ lệch chuẩn $SD(X)$ lần lượt là bao nhiêu?", "options": ["A. $E(X)$ = 20, $SD(X)$ = 4", "B. $E(X)$ = 20, $SD(X)$ = 16", "C. $E(X)$ = 50, $SD(X)$ = 5", "D. $E(X)$ = 20, $SD(X)$ = 2"], "correct": [0], "explanation": "Với X ~ Bin(n, p): $E(X)$ = n*$p = 100$*0.2 = 20. $Var(X)$ = n*p*(1-p) = 100 * 0.2 * 0.8 = 16 -> $SD(X)$ = $\\sqrt{16}$ = 4.", "multiple": false}, {"id": "w07_q013", "week": 7, "topic": "Độ lệch chuẩn của Trung bình mẫu", "difficulty": "medium", "question": "Rút một mẫu ngẫu nhiên độc lập $n = 64$ phần tử từ một quần thể có độ lệch chuẩn $\\sigma = 16$. Độ lệch chuẩn của trung bình mẫu $(\\bar{X})$ (còn gọi là Sai số chuẩn SE) bằng bao nhiêu?", "options": ["A. 16", "B. $\\frac{16}{\\sqrt{64}} = \\frac{16}{8} = 2$", "C. $16 / 64 = 0.25$", "D. 128"], "correct": [1], "explanation": "Sai số chuẩn của trung bình mẫu: SE = SD($\\bar{X}$) = $\\sigma$ / $\\sqrt{n}$ = 16 / $\\sqrt{64}$ = $16 / 8 = 2.$", "multiple": false}, {"id": "w07_q014", "week": 7, "topic": "Độ lệch chuẩn của Tổng", "difficulty": "medium", "question": "Cũng từ quần thể trên ($\\sigma$ = 16), độ lệch chuẩn của TỔNG 64 phần tử $S_64 = \\sum _{i=1}^{64} X_i$ là bao nhiêu?", "options": ["A. 16 * $\\sqrt{64}$ = 16 * 8 = 128", "B. 16 * 64 = 1024", "C. 16", "D. 2"], "correct": [0], "explanation": "$Var(S_n)$ = n * $\\sigma^2$-> $SD(S_n)$ = $\\sqrt{n}$ *$\\sigma$ = $\\sqrt{64}$ * 16 = 8 * 16 = 128.", "multiple": false}, {"id": "w07_q015", "week": 7, "topic": "Bất đẳng thức Chebyshev", "difficulty": "medium", "question": "Một biến ngẫu nhiên X có kỳ vọng $\\mu$ = 50 và độ lệch chuẩn$\\sigma$ = 5 (không rõ dạng phân phối). Theo bất đẳng thức Chebyshev, xác suất để X nằm NGOÀI khoảng [35, 65] tối đa là bao nhiêu?", "options": ["A. 1/9 ≈ 11.1%", "B. 1/3 ≈ 33.3%", "C. 5%", "D. $1/25 = 4$%"], "correct": [0], "explanation": "Khoảng [35, 65] là khoảng [$\\mu$- 3\\sigma ,$\\mu$+ 3\\sigma ] với $k = 3$. Theo Chebyshev: P(|X -$\\mu$| ≥ 3$\\sigma$) ≤ 1 / $k^2$ = 1 / $3^{2}$ = 1/9 ≈ 11.1%.", "multiple": false}, {"id": "w07_q016", "week": 7, "topic": "Phân phối Đều liên tục U(a, b)", "difficulty": "medium", "question": "Cho biến ngẫu nhiên X tuân theo phân phối đều trên đoạn [2, 10]: X ~ U(2, 10). Kỳ vọng $E(X)$ và xác suất P(4 ≤ X ≤ 7) lần lượt là:", "options": ["A. $E(X)$ = 6; P(4 ≤ X ≤ 7) = (7 - 4) / (10 - 2) = $3/8 = 0.375$", "B. $E(X)$ = 5; P(4 ≤ X ≤ 7) = $3/10 = 0.30$", "C. $E(X)$ = 6; P(4 ≤ X ≤ 7) = 1/8", "D. $E(X)$ = 8; P(4 ≤ X ≤ 7) = 0.5"], "correct": [0], "explanation": "$E(X)$ = (a + b) / 2 = (2 + 10) / 2 = 6. f(x) = 1 / (10 - 2) = 1/8 trên [2, 10]. Xác suất P(4 ≤ X ≤ 7) = (7 - 4) / 8 = $3/8 = 0.375.$", "multiple": false}, {"id": "w07_q017", "week": 7, "topic": "Phân phối Mũ (Exponential)", "difficulty": "medium", "question": "Thời gian chờ xe buýt (tính bằng phút) tuân theo phân phối mũ X ~ Exp($\\lambda$ = 0.1). Kỳ vọng thời gian chờ trung bình $E(X)$ là bao nhiêu?", "options": ["A. 0.1 phút", "B. 1 / 0.1 = 10 phút", "C. 100 phút", "D. 5 phút"], "correct": [1], "explanation": "Đối với phân phối mũ Exp($\\lambda$), kỳ vọng $E(X)$ = 1 /$\\lambda$ = 1 / 0.1 = 10 phút.", "multiple": false}, {"id": "w07_q018", "week": 7, "topic": "Quy tắc bình phương độ lệch chuẩn", "difficulty": "medium", "question": "Để giảm sai số chuẩn của trung bình mẫu SE = $\\sigma$ / $\\sqrt{n}$ đi một nửa (giảm 2 lần), kích thước mẫu n cần phải tăng lên gấp bao nhiêu lần?", "options": ["A. 2 lần", "B. 4 lần", "C. 8 lần", "D. 16 lần"], "correct": [1], "explanation": "Vì n nằm trong dấu căn bậc hai: $\\sqrt{n_mới}$ = 2 * $\\sqrt{n_cũ}$ <=> n_mới = 4 * n_cũ. Muốn độ chính xác tăng gấp đôi, cỡ mẫu phải tăng gấp 4 lần (Quy tắc căn bậc hai của n).", "multiple": false}, {"id": "w07_q019", "week": 7, "topic": "Xác suất phân phối chuẩn với z-score", "difficulty": "medium", "question": "Điểm thi của một kỳ thi chuẩn hóa có phân phối chuẩn N($\\mu$ = 500,$\\sigma$ = 100). Một thí sinh đạt 650 điểm. Giá trị z-score của thí sinh này là bao nhiêu?", "options": ["A. 1.0", "B. 1.5", "C. 2.0", "D. 0.65"], "correct": [1], "explanation": "z = (X - $\\mu$) /$\\sigma$ = (650 - 500) / 100 = $150 / 100 = 1.5.$", "multiple": false}, {"id": "w07_q020", "week": 7, "topic": "Tính tuyến tính của Kỳ vọng với biến phụ thuộc", "difficulty": "medium", "question": "Cho hai biến ngẫu nhiên X và Y có $E(X)$ = 5 và $E(Y)$ = 8. Nếu X và Y KHÔNG ĐỘC LẬP (phụ thuộc nhau), khẳng định nào sau đây là ĐÚNG?", "options": ["A. $E(X + Y)$ không tính được vì thiếu hệ số tương quan.", "B. $E(X + Y)$ = $E(X) + E(Y)$ = 5 + 8 = 13 (tính tuyến tính của kỳ vọng luôn đúng bất kể tính độc lập).", "C. $E(X + Y)$ > 13.", "D. $Var(X + Y)$ = $Var(X) + Var(Y)$."], "correct": [1], "explanation": "Tính tuyến tính của kỳ vọng $E(X + Y)$ = $E(X) + E(Y)$ LUÔN ĐÚNG cho mọi cặp biến ngẫu nhiên, hoàn toàn không phụ thuộc vào việc X và Y có độc lập hay không.", "multiple": false}, {"id": "w07_q021", "week": 7, "topic": "Phân phối Poisson: Kỳ vọng và Phương sai", "difficulty": "medium", "question": "Biến ngẫu nhiên X tuân theo phân phối Poisson với tham số $\\lambda$ = 7. Kỳ vọng $E(X)$ và phương sai $Var(X)$ lần lượt là:", "options": ["A. $E(X)$ = 7, $Var(X)$ = 7", "B. $E(X)$ = 7, $Var(X)$ = 49", "C. $E(X)$ = 49, $Var(X)$ = 7", "D. $E(X)$ = 7, $Var(X)$ = $\\sqrt{7}$"], "correct": [0], "explanation": "Đặc trưng nổi bật của phân phối Poisson là kỳ vọng bằng chính phương sai: $E(X)$ = $Var(X)$ = $\\lambda$ = 7.", "multiple": false}, {"id": "w07_q022", "week": 7, "topic": "Python / scipy.stats: norm", "difficulty": "medium", "question": "Để tính xác suất P(X ≤ 12) với X ~ N($\\mu$ = 10,$\\sigma$ = 2) trong Python, cú pháp nào sau đây là chính xác?", "options": ["A. `scipy.stats.norm.pdf(12, loc=10, scale=2)`", "B. `scipy.stats.norm.cdf(12, loc=10, scale=2)`", "C. `scipy.stats.norm.ppf(12, loc=10, scale=2)`", "D. `scipy.stats.norm.rvs(12, loc=10, scale=2)`"], "correct": [1], "explanation": "`norm.cdf(x, loc=μ, scale=σ)` tính xác suất tích lũy P(X ≤ x). `pdf` là giá trị mật độ, `ppf` là hàm phân vị ngược.", "multiple": false}, {"id": "w07_q023", "week": 7, "topic": "Luật số lớn yếu (WLLN)", "difficulty": "medium", "question": "Luật số lớn yếu (Weak Law of Large Numbers) bảo đảm điều gì khi số phép thử n tiến ra vô cùng?", "options": ["A. Mọi quan sát đơn lẻ trong tương lai sẽ bằng chính xác $\\mu$.", "B. Xác suất để trung bình mẫu $\\bar{X}_{n}$ sai lệch so với kỳ vọng lý thuyết $\\mu$ một lượng lớn hơn$\\varepsilon$ bất kỳ sẽ tiến dần về 0: lim P(|$\\bar{X}_{n}$ -$\\mu$| ≥$\\varepsilon$) = 0.", "C. Phương sai của tổng n biến ngẫu nhiên tiến về 0.", "D. Không bao giờ xuất hiện chuỗi thua liên tiếp."], "correct": [1], "explanation": "WLLN khẳng định sự hội tụ theo xác suất của trung bình mẫu về kỳ vọng quần thể khi kích thước mẫu n tăng lên vô hạn.", "multiple": false}, {"id": "w07_q024", "week": 7, "topic": "Mô hình chiếc hộp (Box Model)", "difficulty": "medium", "question": "Một chiếc hộp chứa các vé: [1, 2, 2, 5]. Rút có hoàn lại 100 lần. Kỳ vọng của tổng số điểm rút được là bao nhiêu?", "options": ["A. 100", "B. Trung bình hộp = (1+2+2+5)/4 = 2.5; Kỳ vọng tổng = 100 * 2.5 = 250", "C. 500", "D. 25"], "correct": [1], "explanation": "Trung bình một lần rút $\\mu_{box}$ = (1 + 2 + 2 + 5)/4 = 2.5. Rút có hoàn lại 100 lần: E(Tổng) = n * $\\mu_{box}$ = 100 * 2.5 = 250.", "multiple": false}, {"id": "w07_q025", "week": 7, "topic": "Phân vị phân phối chuẩn", "difficulty": "medium", "question": "Giá trị tới hạn z_0.025 (phân vị chuẩn tắc sao cho P(Z > z) = 0.025, tương ứng với khoảng tin cậy 95% ở hai phía) xấp xỉ bằng bao nhiêu?", "options": ["A. 1.00", "B. 1.645", "C. 1.96", "D. 2.58"], "correct": [2], "explanation": "Trong phân phối chuẩn tắc, P(-1.96 ≤ Z ≤ 1.96) ≈ 0.95 (95%), do đó giá trị z tới hạn hai phía là 1.96.", "multiple": false}, {"id": "w07_q026", "week": 7, "topic": "CLT ứng dụng tính xác suất", "difficulty": "hard", "question": "Tung 100 con xúc xắc 6 mặt cân đối độc lập. Mỗi con xúc xắc có kỳ vọng $\\mu$ = 3.5 và phương sai$\\sigma^2$ = 35/12 ≈ 2.917. Theo CLT, tổng số điểm S_100 có phân phối xấp xỉ là gì và xác suất P(S_100 ≥ 370) xấp xỉ bao nhiêu?", "options": ["A. S_100 ~ N(350, 291.7); z = (370 - 350) / $\\sqrt{291.7}$ ≈ 20 / 17.08 ≈ 1.17 -> P ≈ 1 - Φ(1.17) ≈ 0.121", "B. S_100 ~ N(350, 29.17); $z = 3.71$ -> P ≈ 0.0001", "C. P = 0.5", "D. S_100 tuân theo phân phối đều từ 100 đến 600."], "correct": [0], "explanation": "$E(S_100)$ = 100 * 3.5 = 350. $Var(S_100)$ = 100 * (35/12) ≈ 291.67 -> SD = 17.08. Chuẩn hóa: z = (370 - 350)/17.08 ≈ 1.17. P(Z ≥ 1.17) = 1 - 0.879 = 0.121.", "multiple": false}, {"id": "w07_q027", "week": 7, "topic": "Áp dụng bất đẳng thức Chebyshev", "difficulty": "hard", "question": "Một biến ngẫu nhiên có kỳ vọng $\\mu=50$ và độ lệch chuẩn $\\sigma=5$, chưa biết dạng phân phối. Theo bất đẳng thức Chebyshev, xác suất $P(|X-50|\\geq10)$ được chặn trên bởi bao nhiêu?", "options": ["A. 0,10.", "B. 0,20.", "C. 0,25.", "D. 0,50."], "correct": [2], "explanation": "Ở đây $10=2\\sigma$, nên $k=2$. Chebyshev cho $P(|X-\\mu|\\geq k\\sigma)\\leq1/k^2=1/4=0.25$. Không cần giả định phân phối chuẩn.", "multiple": false}, {"id": "w07_q028", "week": 7, "topic": "Phân phối Chi-bình phương (Chi-Square)", "difficulty": "hard", "question": "Nếu Z1, Z2, ..., Zk là k biến ngẫu nhiên ĐỘC LẬP cùng tuân theo phân phối chuẩn tắc N(0, 1). Biến ngẫu nhiên $Q = \\sum_{i=1}^k Z_i^2$ tuân theo phân phối nào?", "options": ["A. Phân phối Chuẩn N(0, k)", "B. Phân phối Chi-bình phương với k bậc tự do: $\\chi^2(k)$", "C. Phân phối t-Student với k bậc tự do", "D. Phân phối F-Snedecor"], "correct": [1], "explanation": "Định nghĩa phân phối Chi-bình phương: Tổng bình phương của k biến ngẫu nhiên chuẩn tắc độc lập có phân phối $\\chi^2(k)$ với k bậc tự do, với kỳ vọng là k và phương sai là 2k.", "multiple": false}, {"id": "w07_q029", "week": 7, "topic": "Phân phối t-Student", "difficulty": "hard", "question": "Phân phối t-Student với k bậc tự do khác với phân phối Chuẩn tắc N(0, 1) ở đặc điểm nào sau đây?", "options": ["A. t-Student bị lệch hẳn về bên phải.", "B. t-Student có hình chuông đối xứng nhưng có 'đuôi dày hơn' (heavier tails) so với phân phối chuẩn; khi k -> ∞, phân phối t hội tụ về N(0, 1).", "C. t-Student chỉ nhận các giá trị dương.", "D. t-Student có phương sai nhỏ hơn 1."], "correct": [1], "explanation": "Phân phối t có đuôi dày hơn để bù đắp cho sự không chắc chắn khi ước lượng độ lệch chuẩn mẫu s thay cho tham số tổng thể $\\sigma$. Khi bậc tự do k lớn, t tiệm cận chuẩn tắc N(0, 1).", "multiple": false}, {"id": "w07_q030", "week": 7, "topic": "Hàm mật độ và Đạo hàm CDF", "difficulty": "hard", "question": "Cho biến ngẫu nhiên liên tục X có CDF F(x) khả vi tại x. Mối liên hệ giữa hàm mật độ f(x) và CDF F(x) là gì?", "options": ["A. f(x) = F'(x) (f(x) là đạo hàm của F(x))", "B. F(x) = f'(x)", "C. f(x) = 1 - F(x)", "D. f(x) = $F(x)^2$"], "correct": [0], "explanation": "Theo Định lý cơ bản của giải tích: Vì F(x) = ∫_{-∞}^x f(t) dt, nên tại các điểm f liên tục thì f(x) = d/dx [F(x)] = F'(x).", "multiple": false}, {"id": "w07_q031", "week": 7, "topic": "Xác suất từ hàm mật độ mũ", "difficulty": "hard", "question": "Một thời gian chờ $X$ có phân phối mũ với tốc độ $\\lambda=2$. Tính $P(0.5<X<1)$.", "options": ["A. $e^{-1}-e^{-2}$.", "B. $1-e^{-1}$.", "C. $e^{-2}$.", "D. $e^{-1}$."], "correct": [0], "explanation": "Với phân phối mũ, $F(x)=1-e^{-\\lambda x}$ khi $x\\geq0$. Do đó $P(0.5<X<1)=F(1)-F(0.5)=(1-e^{-2})-(1-e^{-1})=e^{-1}-e^{-2}$.", "multiple": false}, {"id": "w07_q032", "week": 7, "topic": "Tính không nhớ của Phân phối Mũ", "difficulty": "hard", "question": "Cho X ~ Exp($\\lambda$). Biết rằng một linh kiện đã hoạt động tốt trong 100 giờ (X > 100). Xác suất linh kiện này hoạt động thêm ít nhất 50 giờ nữa P(X > 150 | X > 100) bằng bao nhiêu?", "options": ["A. P(X > 50) = $e^{-50\\lambda}$ (tính không nhớ)", "B. P(X > 150)", "C. $e^{-150\\lambda}$ / $e^{-100\\lambda}$ = $e^{-50\\lambda}$ (hai kết quả đồng nhất)", "D. Cả A và C đều đúng."], "correct": [3], "explanation": "Phân phối mũ là phân phối liên tục DUY NHẤT có tính không nhớ: P(X > s + t | X > s) = P(X > t). Quá khứ không ảnh hưởng đến tuổi thọ còn lại (không bị hao mòn theo thời gian).", "multiple": false}, {"id": "w07_q033", "week": 7, "topic": "Tính phương sai từ mômen", "difficulty": "hard", "question": "Một biến ngẫu nhiên có $E(X)=2$ và $E(X^2)=7$. Phương sai $Var(X)$ bằng bao nhiêu?", "options": ["A. 3.", "B. 5.", "C. 7.", "D. 11."], "correct": [0], "explanation": "$Var(X)=E(X^2)-[E(X)]^2=7-2^2=3$. Phương sai đo mức độ phân tán quanh kỳ vọng.", "multiple": false}, {"id": "w07_q034", "week": 7, "topic": "Định lý giới hạn trung tâm cho trung bình mẫu", "difficulty": "hard", "question": "Các biến ngẫu nhiên $X_1,\\ldots,X_{100}$ độc lập, cùng phân phối, có $E(X_i)=5$ và $SD(X_i)=5$. Theo xấp xỉ CLT, phân phối gần đúng của trung bình mẫu $\\bar X$ có kỳ vọng và độ lệch chuẩn lần lượt là bao nhiêu?", "options": ["A. 500 và 50.", "B. 5 và 0,5.", "C. 5 và 5.", "D. 500 và 5."], "correct": [1], "explanation": "$E(\\bar X)=\\mu=5$ và $SD(\\bar X)=\\sigma/\\sqrt n=5/10=0.5$. CLT cho biết phân phối của trung bình mẫu được xấp xỉ bởi phân phối chuẩn khi các điều kiện thích hợp được thỏa mãn.", "multiple": false}, {"id": "w07_q035", "week": 7, "topic": "Điều kiện của Định lý Giới hạn Trung tâm", "difficulty": "hard", "question": "CLT KHÔNG ÁP DỤNG ĐƯỢC cho trung bình mẫu của các biến ngẫu nhiên độc lập trong trường hợp nào sau đây?", "options": ["A. Khi phân phối gốc bị lệch phải rất mạnh.", "B. Khi phân phối gốc là phân phối Cauchy (hoặc phân phối có phương sai vô hạn / không tồn tại kỳ vọng).", "C. Khi phân phối gốc là biến rời rạc nhị phân.", "D. Khi kích thước mẫu $n = 1000$."], "correct": [1], "explanation": "Điều kiện tiên quyết của CLT cổ điển (Lindeberg-Lévy) là biến ngẫu nhiên phải có kỳ vọng $\\mu$ và phương sai$\\sigma^2$ HỮU HẠN. Phân phối Cauchy có đuôi cực nặng nên không tồn tại kỳ vọng và phương sai vô hạn, CLT hoàn toàn mất hiệu lực (trung bình mẫu của Cauchy vẫn là Cauchy bất kể n lớn cỡ nào).", "multiple": false}];

    let filteredQuestions = [...allQuestions];
    let currentIndex = 0;
    let mode = 'single';
    let userAnswers = {};
    let checkedQuestions = {};

    const $id = id => document.getElementById(id);

    // ── Math rendering ──────────────────────────────────────────────
    function renderMath(el) {
      el = el || $id('question-area');
      if (!el) return;
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([el]).catch(e => console.warn('MathJax:', e));
      } else {
        window._renderPending = () => renderMath(el);
      }
    }

    // ── Text formatting ──────────────────────────────────────────────
    function formatText(text) {
      if (!text) return '';
      const codes = [], inlines = [];

      // code blocks
      text = text.replace(/```python([\s\S]*?)```/g, (_, c) => {
        const i = codes.length;
        codes.push(`<pre class="my-2 p-3 bg-slate-900 text-emerald-300 rounded-lg overflow-x-auto text-xs font-mono leading-relaxed"><code>${c.trim()}</code></pre>`);
        return `%%CB${i}%%`;
      });
      // inline code
      text = text.replace(/`([^`]+)`/g, (_, c) => {
        const i = inlines.length;
        inlines.push(`<code class="px-1.5 py-0.5 rounded bg-slate-100 border border-slate-200 text-[0.8em] text-blue-700 font-mono font-semibold">${c}</code>`);
        return `%%IC${i}%%`;
      });

      // Newlines
      text = text.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');

      codes.forEach((b, i) => { text = text.replace(`%%CB${i}%%`, b); });
      inlines.forEach((b, i) => { text = text.replace(`%%IC${i}%%`, b); });
      return text;
    }

    // ── Badges ───────────────────────────────────────────────────────
    function diffBadge(d) {
      const m = {
        easy:   ['Dễ',          'bg-emerald-50 text-emerald-700 border-emerald-200'],
        medium: ['Trung bình',  'bg-amber-50 text-amber-700 border-amber-200'],
        hard:   ['Khó',         'bg-rose-50 text-rose-700 border-rose-200'],
      };
      const [l, c] = m[d] || ['?', ''];
      return `<span class="text-xs px-2 py-0.5 rounded-full border font-semibold ${c}">${l}</span>`;
    }
    function weekBadge(w) {
      return `<span class="text-xs px-2.5 py-0.5 rounded-full border border-blue-200 bg-blue-50 font-bold text-blue-700">Tuần ${String(w).padStart(2,'0')}</span>`;
    }

    // ── Build question card HTML ──────────────────────────────────────
    function buildCard(q, inList) {
      const isMulti = q.correct.length > 1;
      const answered = userAnswers[q.id] || [];
      const checked = checkedQuestions[q.id];

      const optionsHtml = q.options.map((opt, i) => {
        let cls = '';
        let badge = '';

        if (checked) {
          const isCorrect = q.correct.includes(i);
          const isSelected = answered.includes(i);
          if (isCorrect && isSelected)  { cls = 'correct-selected checked'; badge = '<span class="text-emerald-600 font-bold ml-auto shrink-0 text-xs">✓ Đúng</span>'; }
          else if (isCorrect)           { cls = 'correct-unselected checked'; badge = '<span class="text-emerald-700 font-semibold ml-auto shrink-0 text-xs">✓ Đáp án đúng</span>'; }
          else if (isSelected)          { cls = 'wrong checked'; badge = '<span class="text-rose-600 font-bold ml-auto shrink-0 text-xs">✗ Sai</span>'; }
          else                          { cls = 'checked'; }
        } else if (answered.includes(i)) {
          cls = 'selected';
        }

        const inputType = isMulti ? 'checkbox' : 'radio';
        return `<label class="option-label ${cls}">
          <input type="${inputType}" class="shrink-0 mt-0.5 accent-blue-600 w-4 h-4"
            ${answered.includes(i) ? 'checked' : ''} ${checked ? 'disabled' : ''}
            onchange="toggleAnswer('${q.id}', ${i}, ${isMulti})">
          <span class="text-sm leading-relaxed flex-1">${formatText(opt)}</span>
          ${badge}
        </label>`;
      }).join('');

      const explanationHtml = checked ? `
        <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-slate-100">
          <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5 flex items-center gap-1.5">
            <span>💡</span> Lời giải chi tiết
          </div>
          <div class="text-sm leading-relaxed text-slate-700">${formatText(q.explanation)}</div>
        </div>` : '';

      const submitBtn = checked ? '' : `
        <button onclick="checkAnswer('${q.id}')"
          class="mt-4 px-5 py-2.5 bg-blue-600 text-white font-semibold text-sm rounded-xl hover:bg-blue-700 transition-fast shadow-md">
          Kiểm tra đáp án
        </button>`;

      // Show global index in card
      const globalIdx = allQuestions.indexOf(q);
      const displayNum = globalIdx >= 0 ? globalIdx + 1 : q.id.replace(/^w\d+_q0*/, '');

      return `<div ${inList ? `id="q-card-${q.id}"` : ''}
        class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm ${inList ? 'mb-5' : ''}">
        <div class="flex flex-wrap items-center gap-2 mb-3 text-xs">
          ${weekBadge(q.week)}
          <span class="font-medium text-slate-500">${q.topic || ''}</span>
          <div class="ml-auto flex items-center gap-2">
            ${diffBadge(q.difficulty)}
            <span class="px-2 py-0.5 rounded border border-slate-200 text-slate-500 font-medium">${isMulti ? 'Nhiều đáp án' : '1 đáp án'}</span>
          </div>
        </div>
        <div class="font-semibold text-base mb-4 leading-relaxed text-slate-900">
          <span class="text-blue-600">Câu ${displayNum}: </span>${formatText(q.question)}
        </div>
        <div class="space-y-2.5">${optionsHtml}</div>
        ${submitBtn}
        ${explanationHtml}
      </div>`;
    }

    // ── Render current view ──────────────────────────────────────────
    function renderCurrentView() {
      const qa = $id('question-area');
      if (mode === 'single') {
        $id('nav-buttons').style.display = 'flex';
        if (!filteredQuestions.length) {
          qa.innerHTML = '<div class="text-center py-20 text-slate-400">Không tìm thấy câu hỏi phù hợp.</div>';
          $id('nav-counter').textContent = '';
          return;
        }
        const q = filteredQuestions[currentIndex];
        qa.innerHTML = buildCard(q, false);
        $id('nav-counter').textContent = `Câu ${currentIndex + 1} / ${filteredQuestions.length}`;
        $id('progress-bar').style.width = `${((currentIndex + 1) / filteredQuestions.length * 100).toFixed(1)}%`;
        $id('progress-label').textContent = `${currentIndex + 1} / ${filteredQuestions.length}`;
      } else {
        $id('nav-buttons').style.display = 'none';
        if (!filteredQuestions.length) {
          qa.innerHTML = '<div class="text-center py-20 text-slate-400">Không tìm thấy câu hỏi phù hợp.</div>';
          return;
        }
        qa.innerHTML = filteredQuestions.map(q => buildCard(q, true)).join('');
        $id('progress-bar').style.width = '100%';
        $id('progress-label').textContent = `${filteredQuestions.length} câu`;
      }
      renderPalette();
      updateStats();
      renderMath();
    }

    // ── Palette ────────────────────────────────────────────────────
    function renderPalette() {
      $id('palette-count').textContent = filteredQuestions.length + ' câu';
      $id('palette-grid').innerHTML = filteredQuestions.map((q, idx) => {
        const sel = userAnswers[q.id] || [];
        const chk = checkedQuestions[q.id];
        let cls = 'bg-slate-50 border-slate-200 text-slate-600';
        if (chk) {
          const ok = q.correct.length === sel.length && q.correct.every(i => sel.includes(i));
          cls = ok ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-rose-600 text-white border-rose-600';
        } else if (sel.length > 0) {
          cls = 'bg-blue-600 text-white border-blue-600 font-bold';
        }
        const active = (mode === 'single' && idx === currentIndex) ? 'ring-2 ring-blue-500 ring-offset-1 scale-105' : '';
        const globalIdx = allQuestions.indexOf(q);
        return `<button onclick="jumpTo(${idx})"
          class="w-full aspect-square text-[10px] font-bold rounded-lg border ${cls} ${active} hover:opacity-80 transition-fast">
          ${globalIdx >= 0 ? globalIdx + 1 : idx + 1}
        </button>`;
      }).join('');
    }

    // ── Interactions ──────────────────────────────────────────────
    function toggleAnswer(id, idx, isMulti) {
      if (checkedQuestions[id]) return;
      let sel = [...(userAnswers[id] || [])];
      if (isMulti) {
        sel = sel.includes(idx) ? sel.filter(i => i !== idx) : [...sel, idx];
      } else {
        sel = [idx];
      }
      userAnswers[id] = sel;
      renderCurrentView();
    }

    function checkAnswer(id) {
      if (!userAnswers[id] || !userAnswers[id].length) {
        alert('Vui lòng chọn ít nhất một đáp án trước khi kiểm tra!');
        return;
      }
      checkedQuestions[id] = true;
      renderCurrentView();
    }

    function navigate(dir) {
      currentIndex = Math.max(0, Math.min(filteredQuestions.length - 1, currentIndex + dir));
      renderCurrentView();
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function jumpTo(idx) {
      currentIndex = idx;
      if (mode === 'list') {
        const card = document.getElementById('q-card-' + filteredQuestions[idx].id);
        if (card) card.scrollIntoView({behavior: 'smooth', block: 'center'});
      } else {
        setMode('single');
        renderCurrentView();
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    }

    function setMode(m) {
      mode = m;
      const sBtn = $id('mode-single'), lBtn = $id('mode-list');
      const active = 'px-3 py-1 rounded-md text-xs font-semibold bg-blue-600 text-white shadow-sm';
      const inactive = 'px-3 py-1 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900';
      sBtn.className = m === 'single' ? active : inactive;
      lBtn.className = m === 'list' ? active : inactive;
      renderCurrentView();
    }

    function applyFilters() {
      const week = $id('filter-week').value;
      const diff = $id('filter-diff').value;
      const q = $id('search-box').value.toLowerCase();
      filteredQuestions = allQuestions.filter(item => {
        if (week !== 'all' && item.week !== parseInt(week)) return false;
        if (diff !== 'all' && item.difficulty !== diff) return false;
        if (q && !item.question.toLowerCase().includes(q) && !(item.topic || '').toLowerCase().includes(q)) return false;
        return true;
      });
      currentIndex = 0;
      $id('stat-total').textContent = filteredQuestions.length;
      renderCurrentView();
    }

    function updateStats() {
      let answered = 0, correct = 0;
      allQuestions.forEach(q => {
        const sel = userAnswers[q.id];
        if (sel && sel.length) {
          answered++;
          if (checkedQuestions[q.id]) {
            const ok = q.correct.length === sel.length && q.correct.every(i => sel.includes(i));
            if (ok) correct++;
          }
        }
      });
      $id('stat-answered').textContent = answered;
      $id('stat-correct').textContent  = correct;
    }

    function resetProgress() {
      if (confirm('Bạn có chắc muốn làm lại từ đầu toàn bộ các câu hỏi?')) {
        userAnswers = {};
        checkedQuestions = {};
        currentIndex = 0;
        renderCurrentView();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      filteredQuestions = [...allQuestions];
      renderCurrentView();
    });
  </script>
</body>
</html>
