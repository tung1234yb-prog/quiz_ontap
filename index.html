ại sao không thể đọc số lượng quan sát trực tiếp từ chiều cao cột? Chọn mã đáp án gồm chính xác tất cả các nhận định đúng.\n\nCác nhận định:\n- (1) Chiều cao trong histogram mật độ là mật độ (% / chiều rộng), không phải số đếm\n- (2) Thông tin về số lượng nằm ở diện tích (chiều cao × chiều rộng), không phải chiều cao đơn thuần\n- (3) Hai lớp có cùng diện tích → cùng số quan sát, dù chiều cao khác nhau\n- (4) Chiều cao cột trong histogram mật độ luôn nhỏ hơn 1.0\n\nMã đáp án:", "options": ["A. (1), (2), (3)", "B. (1), (2), (4)", "C. (1), (3), (4)", "D. (2), (3), (4)"], "correct": [0], "explanation": "Trong histogram mật độ, chiều cao là mật độ theo chiều rộng lớp; diện tích cột mới biểu diễn tần suất/tỷ lệ của lớp.", "multiple": false}, {"id": "w03_q030", "week": 3, "topic": "Nghịch lý Simpson — cơ chế", "difficulty": "hard", "question": "Tỉ lệ gộp của hai nhóm là trung bình có trọng số của tỉ lệ các nhóm con. Trong ví dụ nghịch lý Simpson (thuật toán A và B), tỉ lệ gộp của A được tính là:\n- A: 90% tác vụ dễ (tỉ lệ = 90%), 10% tác vụ khó (tỉ lệ = 10%)\n\nTỉ lệ gộp của A là bao nhiêu?", "options": ["A. 50%", "B. 82%", "C. 65%", "D. 90%"], "correct": [1], "explanation": "Tỉ lệ gộp của A = 0.90 × 0.90 + 0.10 × 0.10 = 0.81 + 0.01 = 0.82 = 82%. Với B: 0.20 × 0.95 + 0.80 × 0.20 = 0.19 + 0.16 = 0.35 = 35%. Dù B tốt hơn A trong từng nhóm, A cao hơn khi gộp vì phần lớn tác vụ của A là dễ.", "multiple": false}, {"id": "w03_q031", "week": 3, "topic": "Nghịch lý Simpson — điều kiện đảo chiều", "difficulty": "hard", "question": "Tiêu chuẩn tối thiểu để gọi một hiện tượng là 'nghịch lý Simpson' (đảo chiều) là gì? Chọn mã đáp án gồm chính xác tất cả các nhận định đúng.\n\nCác nhận định:\n- (1) Chiều của mối liên hệ (hoặc dấu của sự khác biệt) phải đảo ngược khi chuyển giữa mức biên và mức có điều kiện\n- (2) Cơ cấu nhóm phải khác nhau giữa hai phương án/điều trị đang so sánh\n- (3) Phải có ít nhất ba nhóm con\n- (4) Kết quả phải là biến nhị phân (thành công/thất bại)\n\nMã đáp án:", "options": ["A. (1), (2)", "B. (1), (3)", "C. (2), (4)", "D. (3), (4)"], "correct": [0], "explanation": "Simpson cần sự đảo chiều giữa kết quả biên và kết quả có điều kiện; sự khác nhau về cơ cấu/trọng số nhóm là yếu tố giải thích quan trọng. Không bắt buộc có ba nhóm hay biến nhị phân.", "multiple": false}, {"id": "w03_q032", "week": 3, "topic": "Điều kiện hóa — phân biệt mô tả và nhân quả", "difficulty": "hard", "question": "Sau khi điều kiện hóa theo `grade` trong dữ liệu khoản vay (Problem Set Bài 9), kết luận về lãi suất theo tình trạng sở hữu nhà thay đổi so với mức biên. Kết luận nào là đúng về mặt thống kê?", "options": ["A. Điều kiện hóa chứng minh sở hữu nhà gây ra mức lãi suất khác nhau", "B. Điều kiện hóa giúp kiểm soát một biến nhiễu (grade), cho thấy mối liên hệ rõ hơn nhưng không chứng minh nhân quả", "C. Nếu kết quả đảo chiều sau điều kiện hóa, ta phải gọi đó là nghịch lý Simpson", "D. Dữ liệu quan sát với điều kiện hóa đủ để suy ra nhân quả"], "correct": [1], "explanation": "Điều kiện hóa giúp giảm trộn lẫn do biến đã quan sát, làm mô tả rõ hơn. Nhưng vẫn có thể có biến ẩn khác, và dữ liệu quan sát không tự tạo ra cơ sở so sánh phản thực. Không phải mọi đảo chiều đều đủ điều kiện gọi là nghịch lý Simpson.", "multiple": false}, {"id": "w03_q033", "week": 3, "topic": "Chuỗi xử lý — thứ tự thao tác", "difficulty": "hard", "question": "Xét câu hỏi: 'Tỉ lệ chim cánh cụt nặng >4000g trong những cá thể có bill_length_mm >= 45'. Chuỗi pipeline nào đúng?", "options": ["A. `.groupby('species').agg(...).query('bill_length_mm >= 45')`", "B. `.query('bill_length_mm >= 45').assign(heavy=...).agg(p_heavy=('heavy', 'mean'))`", "C. `.assign(heavy=...).groupby('species').query('bill_length_mm >= 45')`", "D. `.agg(p_heavy=...).query('bill_length_mm >= 45').groupby(...)`"], "correct": [1], "explanation": "Phải lọc trước (`.query()`) để giới hạn dân số nghiên cứu, rồi mới tính tỉ lệ trên tập con đó. Nếu nhóm trước rồi lọc sau, câu hỏi sẽ thay đổi — ta sẽ lọc kết quả nhóm, không phải lọc cá thể.", "multiple": false}, {"id": "w03_q034", "week": 3, "topic": "Đồ họa — che mất cấu trúc", "difficulty": "hard", "question": "Trong tình huống W03-CH04 (máy chủ): biểu đồ gộp cho thấy tải cao đi cùng thông lượng cao. Sau khi điều kiện hóa theo loại máy, thông lượng giảm khi tải tăng trong từng loại. Cơ chế nào tạo ra ảo giác trong biểu đồ gộp?", "options": ["A. Lỗi đo lường ngẫu nhiên", "B. Máy hiệu năng cao vừa chịu tải cao hơn vừa có thông lượng cao hơn; biểu đồ gộp trộn khác biệt giữa loại máy với thay đổi trong cùng loại máy", "C. Tập dữ liệu quá nhỏ để rút ra kết luận chính xác", "D. Trục x và y bị đặt ngược nhau"], "correct": [1], "explanation": "Đây là dạng biến nhiễu ẩn (confounding variable): loại máy ảnh hưởng đến cả tải lẫn thông lượng. Biểu đồ gộp không tách được 'khác biệt giữa loại máy' khỏi 'quan hệ tải-thông lượng trong cùng loại máy'. Điều kiện hóa theo loại máy mới lộ cấu trúc thực.", "multiple": false}, {"id": "w03_q035", "week": 3, "topic": "Khẳng định về nghịch lý Simpson", "difficulty": "hard", "question": "Khẳng định: 'Nếu một mối liên hệ xuất hiện trong toàn bộ dữ liệu, nó phải xuất hiện cùng chiều trong mọi nhóm con.' Đây là:", "options": ["A. Đúng — đây là tính chất cơ bản của số liệu thống kê", "B. Sai — ví dụ nghịch lý Simpson là phản ví dụ trực tiếp: B có tỉ lệ cao hơn trong cả hai nhóm nhưng thấp hơn khi gộp", "C. Đúng trong mọi trường hợp trừ khi cỡ mẫu quá nhỏ", "D. Đúng nếu dùng dữ liệu ngẫu nhiên"], "correct": [1], "explanation": "Khẳng định sai. Nghịch lý Simpson (W03-EX07) là phản ví dụ trực tiếp: B có tỉ lệ thành công cao hơn A trong cả nhóm dễ lẫn nhóm khó, nhưng khi gộp, A lại cao hơn B. Tỉ lệ biên và tỉ lệ có điều kiện có thể cho kết luận ngược chiều.", "multiple": false}, {"id": "w03_q036", "week": 3, "topic": "Thiết kế pipeline — CASE01", "difficulty": "hard", "question": "Trong W03-CASE01, sau khi lọc ra subset (không phải Adelie, bill_length_mm trong [40,50]), kết quả tóm tắt cho thấy Chinstrap và Gentoo có cùng mean_length (~46.52 mm) nhưng mean_depth rất khác (17.82 vs 14.78). Điều này minh họa nguyên tắc gì?", "options": ["A. Tóm tắt một biến đơn có thể bỏ lỡ cấu trúc phân nhóm quan trọng", "B. Không nên dùng số trung bình trong thống kê", "C. Hai loài có thể hoán đổi cho nhau vì có cùng chiều dài mỏ", "D. Cần thêm dữ liệu để phân biệt hai loài"], "correct": [0], "explanation": "Hai loài có mean_length giống hệt nhau nhưng mean_depth rất khác. Nếu chỉ tóm tắt một biến (bill_length_mm), ta bỏ lỡ hoàn toàn sự khác biệt theo chiều kia. Biểu đồ hai chiều (phân tán) giúp thấy cấu trúc mà tóm tắt đơn biến che mất.", "multiple": false}, {"id": "w03_q037", "week": 3, "topic": "Tỉ lệ biên — trọng số nhóm", "difficulty": "hard", "question": "Trong bài tập Problem Set 03 Bài 5, nếu thay đổi cơ cấu mẫu từ (151 Adelie, 68 Chinstrap, 123 Gentoo) sang (10 Adelie, 10 Chinstrap, 80 Gentoo), tỉ lệ biên H=1 thay đổi thế nào? (Tỉ lệ theo loài: Adelie 23.2%, Chinstrap 22.1%, Gentoo 99.2%)", "options": ["A. Tỉ lệ biên tăng mạnh vì Gentoo chiếm ưu thế", "B. Tỉ lệ biên giảm xuống gần 23%", "C. Tỉ lệ biên không đổi vì tỉ lệ theo loài không đổi", "D. Không thể tính được vì thay đổi cơ cấu"], "correct": [0], "explanation": "Tỉ lệ biên = trung bình có trọng số: (10×0.232 + 10×0.221 + 80×0.992)/100 = (2.32 + 2.21 + 79.36)/100 ≈ 83.9%. Tăng mạnh vì Gentoo (99.2%) giờ chiếm 80% mẫu. Tỉ lệ biên phụ thuộc rất nhiều vào cơ cấu nhóm trong mẫu.", "multiple": false}, {"id": "w03_q038", "week": 3, "topic": "Đọc mã phức hợp — pipeline", "difficulty": "hard", "question": "Đoạn mã sau làm gì?\n```python\n(\n    msleep\n    .assign(gt_8=msleep['sleep_total'] > 8)\n    .groupby('vore', dropna=False)\n    .agg(p_gt_8hrs=('gt_8', 'mean'), n=('sleep_total', 'size'))\n)\n```\n(Chọn tất cả mô tả đúng) Chọn mã đáp án gồm chính xác tất cả các nhận định đúng.\n\nCác nhận định:\n- (1) Tạo biến boolean gt_8 cho từng loài\n- (2) Nhóm theo chế độ ăn (vore), bao gồm cả giá trị thiếu\n- (3) Tính tỉ lệ loài ngủ >8 giờ và số lượng loài trong từng chế độ ăn\n- (4) Kết quả có một hàng cho mỗi loài động vật trong msleep\n\nMã đáp án:", "options": ["A. (1), (2), (3)", "B. (1), (2), (4)", "C. (1), (3), (4)", "D. (2), (3), (4)"], "correct": [0], "explanation": "`assign` tạo cột logic; `groupby(..., dropna=False)` giữ cả nhóm thiếu; `agg` tính tỷ lệ bằng mean của boolean và kích thước nhóm. Mỗi hàng kết quả là một nhóm vore.", "multiple": false}, {"id": "w03_q039", "week": 3, "topic": "Histogram — heaping (Problem Set Bài 7)", "difficulty": "hard", "question": "Trong Problem Set Bài 7 (run10, biến age), nếu biểu đồ tỉ lệ chữ số cuối cho thấy chữ số 0 và 5 chiếm tổng cộng ~35% (thay vì ~20% nếu đều), điều nào là kết luận hợp lý?", "options": ["A. Chắc chắn người chạy khai gian tuổi", "B. Có dấu hiệu 'heaping' tại số tròn (0, 5), nhưng còn nhiều cơ chế khác có thể giải thích", "C. Dữ liệu bị lỗi và cần loại bỏ", "D. Biểu đồ này đủ bằng chứng để kết luận về gian lận"], "correct": [1], "explanation": "Heaping (tụ đỉnh tại số tròn) là hiện tượng thường gặp trong dữ liệu tự báo cáo. Có thể do làm tròn khi nhớ, lỗi nhập liệu, hay quy ước ghi tuổi. Biểu đồ mô tả mẫu hình nhưng không đủ để chứng minh gian lận — cần thêm bằng chứng.", "multiple": false}, {"id": "w03_q040", "week": 3, "topic": "Ngữ pháp đồ họa — tổng hợp", "difficulty": "hard", "question": "Phân tích cú pháp biểu đồ phân tán: trục x = bill_length_mm, trục y = bill_depth_mm, màu = species. Nếu bỏ biến species khỏi dữ liệu, điều gì xảy ra?", "options": ["A. Biểu đồ vẫn y hệt, chỉ không có chú giải màu", "B. Các điểm vẫn hiển thị tại cùng tọa độ (x, y) nhưng mất phân biệt loài; không thể phân biệt các cụm điểm tương ứng với loài nào", "C. Biểu đồ sẽ tự động dùng biến khác thay thế species", "D. Biểu đồ sẽ lỗi và không hiển thị"], "correct": [1], "explanation": "Nếu bỏ species, biểu đồ vẫn vẽ được (chỉ dùng x và y), nhưng tất cả điểm sẽ có cùng màu — không còn phân biệt loài. Ta vẫn thấy các cặp (bill_length, bill_depth) nhưng không biết cụm nào thuộc loài nào. Đây là thông tin bị mất khi bỏ một ánh xạ.", "multiple": false}, {"id": "w03_q041", "week": 3, "topic": "Problem Set — county histogram", "difficulty": "hard", "question": "Trong Problem Set Bài 6 (county), bạn so sánh histogram số đếm của tỉ lệ nghèo cho nhóm metro và non-metro. Vì sao histogram số đếm (count) có thể gây hiểu sai khi hai nhóm có kích thước rất khác nhau?", "options": ["A. Nhóm có nhiều county hơn sẽ có cột cao hơn ở mọi bin, dễ nhầm 'tập trung hơn' với 'đông hơn'", "B. Histogram số đếm không thể dùng cho dữ liệu địa lý", "C. Màu sắc của hai histogram sẽ bị trùng nhau", "D. Không thể so sánh hai nhóm trên cùng một histogram"], "correct": [0], "explanation": "Khi một nhóm lớn hơn nhiều, cột của nó cao hơn ở mọi bin dù phân phối tương đồng. Người đọc dễ nhầm 'cột cao = tập trung hơn'. Giải pháp: dùng tỉ lệ hoặc mật độ, sao cho diện tích mỗi histogram tương ứng 100% của chính nhóm đó.", "multiple": false}, {"id": "w03_q042", "week": 3, "topic": "Ngữ pháp đồ họa — sai lầm phổ biến", "difficulty": "hard", "question": "Khẳng định: 'Thêm càng nhiều lớp vào biểu đồ (điểm + đường + màu + kích thước) thì biểu đồ càng tốt.' Đây là:", "options": ["A. Đúng — thêm thông tin luôn tốt hơn", "B. Sai — một biểu đồ tốt tối ưu cho một câu hỏi cụ thể; nhiều lớp có thể tăng tải nhận thức và che lấp thông điệp chính", "C. Đúng nếu dùng màu khác nhau cho mỗi lớp", "D. Phụ thuộc vào phần mềm sử dụng"], "correct": [1], "explanation": "Nguyên tắc: thêm lớp khi lớp đó cung cấp thông tin cần thiết cho câu hỏi, không phải vì phần mềm cho phép. Khi dữ liệu dày hoặc lớp nhiều, có thể gây chồng lấp, tăng tải nhận thức và làm đường xu hướng khó nhìn hơn.", "multiple": false}, {"id": "w03_q043", "week": 3, "topic": "Problem Set — ncbirths (Bài 10)", "difficulty": "hard", "question": "Trong Problem Set Bài 10 (ncbirths): một người chỉ nhìn histogram tuổi mẹ của các ca sinh non và kết luận 'nguy cơ sinh non cao nhất ở nhóm tuổi có cột cao nhất'. Lỗi logic cơ bản của suy luận này là gì?", "options": ["A. Histogram không nên dùng cho biến tuổi", "B. Lỗi mẫu số: số ca sinh non cao ở một nhóm tuổi có thể chỉ vì nhóm đó có nhiều ca sinh, không phải tỉ lệ cao — cần chia cho tổng số ca sinh trong nhóm tuổi đó", "C. Nên dùng biểu đồ đường thay vì histogram", "D. Tuổi mẹ không liên quan đến sinh non"], "correct": [1], "explanation": "Đây là lỗi mẫu số (denominator error): tỉ lệ sinh non = (số ca sinh non trong nhóm) / (tổng số ca sinh trong nhóm). Nhóm tuổi 25-30 có nhiều ca sinh non nhất có thể chỉ vì có nhiều bà mẹ nhất ở độ tuổi đó, không phải vì nguy cơ cao hơn.", "multiple": false}, {"id": "w03_q044", "week": 3, "topic": "Chuỗi xử lý — query với biến Python", "difficulty": "hard", "question": "Trong pandas `.query()`, cú pháp nào đúng để lọc với giá trị từ biến Python bên ngoài `threshold = 4000`?", "options": ["A. `df.query('body_mass_g > threshold')`", "B. `df.query('body_mass_g > @threshold')`", "C. `df.query(f'body_mass_g > {threshold}')`", "D. Cả B và C đều hợp lệ"], "correct": [3], "explanation": "Pandas `.query()` hỗ trợ hai cách tham chiếu biến Python: (1) dùng `@` trước tên biến: `'body_mass_g > @threshold'`; (2) dùng f-string để nội suy giá trị: `f'body_mass_g > {threshold}'`. Cả hai đều hợp lệ.", "multiple": false}, {"id": "w03_q045", "week": 3, "topic": "Tổng kết — nguyên tắc phân tích dữ liệu", "difficulty": "hard", "question": "Câu nào sau đây mô tả đúng nguyên tắc rút ra từ tuần 03? Chọn mã đáp án gồm chính xác tất cả các nhận định đúng.\n\nCác nhận định:\n- (1) Tóm tắt biên và tóm tắt có điều kiện trả lời các câu hỏi khác nhau và có thể dẫn đến kết luận trái chiều\n- (2) Thứ tự các thao tác trong pipeline pandas có thể thay đổi câu hỏi thống kê mà đoạn mã trả lời\n- (3) Điều kiện hóa giúp làm lộ cấu trúc ẩn nhưng không tự động chứng minh nhân quả\n- (4) Một biểu đồ 'đúng số' luôn tạo ra ấn tượng đúng\n\nMã đáp án:", "options": ["A. (1), (2), (3)", "B. (1), (2), (4)", "C. (1), (3), (4)", "D. (2), (3), (4)"], "correct": [0], "explanation": "Tóm tắt biên và có điều kiện có thể khác nhau; thứ tự pipeline thay đổi phép phân tích; điều kiện hóa không tự chứng minh nhân quả.", "multiple": false}, {"id": "w04_q001", "week": 4, "topic": "Hệ số tương quan Pearson", "difficulty": "easy", "question": "Hệ số tương quan Pearson r nhận giá trị trong khoảng nào sau đây?", "options": ["A. [0, 1]", "B. [-1, 1]", "C. (-∞, +∞)", "D. [-100, 100]"], "correct": [1], "explanation": "Hệ số tương quan Pearson r luôn nằm trong đoạn [-1, 1], trong đó $r = 1$ biểu thị tương quan tuyến tính dương hoàn hảo, r = -1 biểu thị tương quan tuyến tính âm hoàn hảo.", "multiple": false}, {"id": "w04_q002", "week": 4, "topic": "Hệ số tương quan Pearson", "difficulty": "easy", "question": "Nếu hệ số tương quan giữa hai biến X và Y là $r = 0$, điều này có nghĩa là gì?", "options": ["A. Không tồn tại mối quan hệ TUYẾN TÍNH giữa X và Y.", "B. Hai biến X và Y hoàn toàn không có bất kỳ mối liên hệ nào (kể cả phi tuyến).", "C. X và Y độc lập tuyệt đối.", "D. Đồ thị phân tán là một đường thẳng nằm ngang."], "correct": [0], "explanation": "$r = 0$ chỉ chứng tỏ không có mối quan hệ tuyến tính. Giữa X và Y vẫn có thể tồn tại mối quan hệ phi tuyến rất chặt chẽ (ví dụ: $Y = X^2$).", "multiple": false}, {"id": "w04_q003", "week": 4, "topic": "Mô hình hồi quy tuyến tính", "difficulty": "easy", "question": "Cho phương trình hồi quy tuyến tính đơn: ŷ = 12 + 3.5x. Nếu $x = 4$, giá trị dự báo ŷ bằng bao nhiêu?", "options": ["A. 14.0", "B. 26.0", "C. 48.0", "D. 22.5"], "correct": [1], "explanation": "Thay $x = 4$ vào phương trình: ŷ = 12 + 3.5 * 4 = 12 + 14 = 26.0.", "multiple": false}, {"id": "w04_q004", "week": 4, "topic": "Định nghĩa Phần dư (Residual)", "difficulty": "easy", "question": "Phần dư e_i của quan sát thứ i trong mô hình hồi quy được tính bằng công thức nào?", "options": ["A. e_i = ŷ_i - y_i", "B. e_i = y_i - ŷ_i (Thực tế - Dự báo)", "C. e_i = y_i / ŷ_i", "D. e_i = (y_i - ȳ) / s_y"], "correct": [1], "explanation": "Theo định nghĩa chuẩn: Phần dư = Giá trị thực tế - Giá trị khớp dự báo: e_i = y_i - ŷ_i.", "multiple": false}, {"id": "w04_q005", "week": 4, "topic": "Đơn vị đo của hệ số tương quan", "difficulty": "easy", "question": "Nếu X đo bằng mét (m) và Y đo bằng kilôgam (kg), đơn vị đo của hệ số tương quan r là gì?", "options": ["A. m * kg", "B. kg / m", "C. Không có đơn vị (đại lượng vô thứ nguyên)", "D. $m^2$"], "correct": [2], "explanation": "Hệ số tương quan Pearson được chuẩn hóa bằng cách chia cho tích của hai độ lệch chuẩn nên là một đại lượng không thứ nguyên (dimensionless).", "multiple": false}, {"id": "w04_q006", "week": 4, "topic": "Nguyên lý OLS", "difficulty": "easy", "question": "Phương pháp Bình phương tối thiểu thông thường (Ordinary Least Squares - OLS) tìm đường hồi quy bằng cách nào?", "options": ["A. Tối đa hóa số điểm dữ liệu nằm trên đường thẳng.", "B. Tối thiểu hóa tổng bình phương của các phần dư: $\\sum$ $(y_i - \\hat{y}_i)^2$.", "C. Tối thiểu hóa tổng khoảng cách theo phương ngang.", "D. Tối đa hóa khoảng cách giữa các điểm ngoại lệ."], "correct": [1], "explanation": "OLS tìm các hệ số b0, b1 sao cho tổng bình phương các khoảng cách theo phương thẳng đứng (tổng bình phương phần dư $\\sum$ e_$i^2$) đạt giá trị nhỏ nhất.", "multiple": false}, {"id": "w04_q007", "week": 4, "topic": "Hệ số xác định R²", "difficulty": "easy", "question": "Trong mô hình hồi quy tuyến tính đơn biến, nếu hệ số tương quan r = -0.8 thì hệ số xác định $R^2$ bằng bao nhiêu?", "options": ["A. -0.64", "B. 0.64", "C. -0.80", "D. 0.80"], "correct": [1], "explanation": "Trong hồi quy đơn biến, $R^2$ = $r^2$ = $ $(-0.8)^2$ $ = 0.64 (tương đương 64% biến thiên của y được giải thích bởi x).", "multiple": false}, {"id": "w04_q008", "week": 4, "topic": "Mức tham chiếu (Baseline/Reference level)", "difficulty": "easy", "question": "Khi đưa một biến phân loại có 3 nhóm (ví dụ: 'Bắc', 'Trung', 'Nam') vào mô hình hồi quy, cần tạo bao nhiêu biến giả (dummy variables)?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "correct": [1], "explanation": "Biến phân loại gồm k mức cần (k - 1) biến dummy, 1 mức còn lại đóng vai trò là mức tham chiếu (baseline / reference level) được hấp thu vào hệ số chặn b0.", "multiple": false}, {"id": "w04_q009", "week": 4, "topic": "Tương quan và Nhân quả", "difficulty": "easy", "question": "Phát biểu nào sau đây là nguyên tắc vàng khi phân tích hệ số tương quan?", "options": ["A. Hệ số tương quan cao luôn chứng minh X là nguyên nhân trực tiếp gây ra Y.", "B. Tương quan không đồng nghĩa với quan hệ nhân quả (Correlation does not imply causation).", "C. Chỉ khi $r = 1$ thì mới có quan hệ nhân quả.", "D. Tương quan âm biểu thị mối quan hệ nhân quả nghịch đảo."], "correct": [1], "explanation": "Tương quan chỉ đo lường mức độ đồng biến thiên thống kê giữa hai biến, không chứng minh được biến này gây ra biến kia vì có thể do biến gây nhiễu hoặc ngẫu nhiên.", "multiple": false}, {"id": "w04_q010", "week": 4, "topic": "Hệ số góc và Tương quan", "difficulty": "medium", "question": "Công thức nào sau đây biểu diễn mối liên hệ giữa hệ số góc b1 của đường hồi quy đơn và hệ số tương quan Pearson r?", "options": ["A. b1 = r * (s_x / s_y)", "B. b1 = r * (s_y / s_x)", "C. b1 = $r^2$ * (s_y / s_x)", "D. b1 = r * (s_$y^{2}$ / s_$x^{2}$)"], "correct": [1], "explanation": "Hệ số góc b1 = r * (s_y / s_x). Nó cùng dấu với r và được tỉ lệ hóa theo độ phân tán của Y trên X.", "multiple": false}, {"id": "w04_q011", "week": 4, "topic": "Điểm đặc biệt trên đường hồi quy", "difficulty": "medium", "question": "Đường hồi quy tuyến tính OLS ŷ = b0 + b1*x LUÔN LUÔN đi qua điểm tọa độ nào sau đây?", "options": ["A. (0, 0)", "B. ($\\bar{x}$, ȳ) - điểm tâm trung bình của mẫu dữ liệu", "C. (Median_x, Median_y)", "D. (s_x, s_y)"], "correct": [1], "explanation": "Vì hệ số chặn b0 = ȳ - b1 * $\\bar{x}$, thay x = $\\bar{x}$ vào phương trình ta được ŷ = (ȳ - b1*$\\bar{x}$) + b1*$\\bar{x}$ = ȳ. Do đó đường hồi quy luôn đi qua điểm trung bình mẫu ($\\bar{x}$, ȳ).", "multiple": false}, {"id": "w04_q012", "week": 4, "topic": "Ý nghĩa của Phần dư", "difficulty": "medium", "question": "Trong một mô hình hồi quy dự báo giá nhà theo diện tích, một ngôi nhà có diện tích 80$\\text{m}^2$ có giá thực tế là 3.0 tỷ, trong khi giá dự báo theo mô hình là 2.6 tỷ. Phần dư của quan sát này là bao nhiêu và có ý nghĩa gì?", "options": ["A. e = -0.4 tỷ; mô hình đã đánh giá quá cao giá trị ngôi nhà.", "B. e = +0.4 tỷ; giá trị thực tế của ngôi nhà cao hơn 0.4 tỷ so với mức trung bình mà mô hình dự đoán cho một ngôi nhà 80$\\text{m}^2$.", "C. e = 5.6 tỷ; ngôi nhà có giá vượt khung.", "D. e = 0.4 tỷ; mô hình đã dự báo sai lệch 40%."], "correct": [1], "explanation": "e = y - ŷ = 3.0 - 2.6 = +0.4 tỷ. Phần dư dương nghĩa là thực tế cao hơn dự báo (mô hình đánh giá thấp so với thực tế của điểm này).", "multiple": false}, {"id": "w04_q013", "week": 4, "topic": "Tính chất của Phần dư trong OLS", "difficulty": "medium", "question": "Trong mô hình hồi quy OLS có hệ số chặn b0, tổng của tất cả các phần dư $\\sum$ e_i luôn bằng bao nhiêu?", "options": ["A. Luôn bằng 1", "B. Luôn bằng 0", "C. Bằng hệ số xác định $R^2$", "D. Bằng độ lệch chuẩn s_y"], "correct": [1], "explanation": "Theo điều kiện bậc nhất của OLS với hệ số chặn, tổng các phần dư $\\sum$ (y_i - ŷ_i) luôn triệt tiêu và bằng 0, nghĩa là trung bình phần dư ē = 0.", "multiple": false}, {"id": "w04_q014", "week": 4, "topic": "Ngoại suy (Extrapolation)", "difficulty": "medium", "question": "Một mô hình hồi quy được xây dựng trên tập dữ liệu trẻ em từ 2 đến 10 tuổi để dự báo chiều cao theo độ tuổi: ŷ = 80 + 6*age. Nhà phân tích dùng mô hình này để dự đoán chiều cao của một người 40 tuổi: ŷ = 80 + 6*40 = 320 cm. Lỗi sai ở đây là gì?", "options": ["A. Lỗi tính toán số học sai.", "B. Ngoại suy (Extrapolation): áp dụng mô hình ra ngoài phạm vi miền giá trị quan sát của biến giải thích, nơi quan hệ tuyến tính không còn đúng.", "C. Lỗi đa cộng tuyến.", "D. Biến tuổi là biến phân loại chứ không phải biến số."], "correct": [1], "explanation": "Ngoại suy là việc dự đoán giá trị cho x nằm ngoài khoảng dữ liệu quan sát. Con người ngừng phát triển chiều cao sau tuổi trưởng thành, đường thẳng không còn giá trị ở tuổi 40.", "multiple": false}, {"id": "w04_q015", "week": 4, "topic": "Biểu đồ phần dư (Residual Plot)", "difficulty": "medium", "question": "Biểu đồ phần dư (vẽ phần dư e theo giá trị dự báo ŷ hoặc x) như thế nào thì cho thấy mô hình tuyến tính là PHÙ HỢP?", "options": ["A. Các điểm phần dư tạo thành một đường cong hình chữ U rõ rệt.", "B. Các điểm phần dư phân tán ngẫu nhiên đồng đều xung quanh đường ngang e = 0, không có mẫu hình hay xu hướng rõ rệt nào.", "C. Các điểm phần dư loe rộng dần ra theo hình chiếc phễu.", "D. Toàn bộ các điểm phần dư đều mang giá trị dương."], "correct": [1], "explanation": "Mô hình tốt phải bóc tách hết cấu trúc có quy luật, để lại phần dư thuần túy là nhiễu ngẫu nhiên phân tán đều quanh 0 (random scatter).", "multiple": false}, {"id": "w04_q016", "week": 4, "topic": "Diễn giải hệ số chặn b0", "difficulty": "medium", "question": "Hệ số chặn b0 trong phương trình hồi quy ŷ = b0 + b1*x mang ý nghĩa thực tế khi nào?", "options": ["A. Luôn luôn có ý nghĩa thực tế trong mọi bài toán.", "B. Chỉ có ý nghĩa thực tế khi $x = 0$ nằm trong phạm vi dữ liệu quan sát và $x = 0$ có ý nghĩa vật lý/kinh tế thực tế.", "C. Không bao giờ có ý nghĩa thực tế.", "D. Chỉ có ý nghĩa khi b0 > 0."], "correct": [1], "explanation": "b0 là giá trị dự báo khi $x = 0$. Nếu $x = 0$ là phi lý (ví dụ: cân nặng một người = 0 kg) hoặc nằm ngoài miền quan sát, b0 chỉ có ý nghĩa toán học để neo đường thẳng chứ không diễn giải thực tế được.", "multiple": false}, {"id": "w04_q017", "week": 4, "topic": "Hồi quy đa biến: Diễn giải hệ số", "difficulty": "medium", "question": "Trong mô hình hồi quy đa biến: ŷ = 50 + 2.5*x1 - 1.2*x2, hệ số 2.5 được diễn giải như thế nào?", "options": ["A. Khi x1 tăng 1 đơn vị, y luôn tăng 2.5 đơn vị trong mọi hoàn cảnh.", "B. Khi x1 tăng 1 đơn vị, giá trị dự báo ŷ tăng trung bình 2.5 đơn vị, với điều kiện GIỮ CỐ ĐỊNH giá trị của x2.", "C. x1 quan trọng hơn x2 gấp 2.5 lần.", "D. Xác suất để y tăng là 2.5%."], "correct": [1], "explanation": "Trong hồi quy đa biến, diễn giải hệ số bắt buộc phải có điều kiện 'giữ cố định các biến còn lại' (holding all other variables constant / ceteris paribus).", "multiple": false}, {"id": "w04_q018", "week": 4, "topic": "Biến phân loại trong hồi quy", "difficulty": "medium", "question": "Mô hình dự báo giá sách (nghìn đồng): ŷ = 150 + 0.2*pages + 40*hardcover, trong đó hardcover là biến chỉ thị (1 nếu sách bìa cứng, 0 nếu sách bìa mềm). Giá dự báo cho một cuốn sách bìa mềm dày 200 trang là bao nhiêu?", "options": ["A. 150 nghìn đồng", "B. 190 nghìn đồng", "C. 230 nghìn đồng", "D. 240 nghìn đồng"], "correct": [1], "explanation": "Sách bìa mềm nên hardcover = 0. Thay vào: ŷ = 150 + 0.2 * 200 + 40 * 0 = 150 + 40 = 190 nghìn đồng.", "multiple": false}, {"id": "w04_q019", "week": 4, "topic": "Biến đổi tuyến tính của biến", "difficulty": "medium", "question": "Nếu chuyển đổi đơn vị của biến X từ mét sang xentimét (X_new = 100 * X), hệ số tương quan r giữa X_new và Y thay đổi như thế nào?", "options": ["A. r tăng lên 100 lần.", "B. r không thay đổi.", "C. r giảm đi 100 lần.", "D. $r^2$ tăng lên 10.000 lần."], "correct": [1], "explanation": "Hệ số tương quan r bất biến trước các phép biến đổi tuyến tính dương (nhân với hằng số dương hoặc cộng thêm hằng số).", "multiple": false}, {"id": "w04_q020", "week": 4, "topic": "Đổi đơn vị và Hệ số góc", "difficulty": "medium", "question": "Trong câu hỏi trên, khi X_new = 100 * X, hệ số góc b1_new của đường hồi quy ŷ theo X_new sẽ thay đổi thế nào so với hệ số góc b1 ban đầu?", "options": ["A. b1_new = b1 (không đổi)", "B. b1_new = b1 / 100", "C. b1_new = 100 * b1", "D. b1_new = -b1"], "correct": [1], "explanation": "b1_new = r * (s_y / s_x_new) = r * (s_y / (100 * s_x)) = b1 / 100. Khi đơn vị của x lớn gấp 100 lần, mức tăng của y trên 1 đơn vị mới sẽ giảm đi 100 lần.", "multiple": false}, {"id": "w04_q021", "week": 4, "topic": "Độ nhạy cảm của tương quan", "difficulty": "medium", "question": "Yếu tố nào sau đây có thể làm thay đổi mạnh mẽ cả giá trị lẫn dấu của hệ số tương quan r và đường hồi quy? Chọn mã đáp án gồm chính xác tất cả các nhận định đúng.\n\nCác nhận định:\n- (1) Sự xuất hiện của một điểm ngoại lệ có đòn bẩy cao (high leverage outlier point).\n- (2) Giới hạn phạm vi khảo sát (range restriction).\n- (3) Việc cộng thêm 10 vào tất cả các giá trị của biến X.\n- (4) Đổi tên biến từ 'salary' sang 'income'.\n\nMã đáp án:", "options": ["A. (1), (2)", "B. (1), (3)", "C. (2), (3)", "D. (3), (4)"], "correct": [0], "explanation": "Điểm ngoại lệ có đòn bẩy cao và việc giới hạn phạm vi X có thể làm thay đổi mạnh tương quan. Cộng hằng số hoặc đổi tên biến không làm thay đổi r.", "multiple": false}, {"id": "w04_q022", "week": 4, "topic": "Hệ số xác định R²", "difficulty": "medium", "question": "Ý nghĩa chính xác của $R^2$ = 0.75 trong mô hình hồi quy là gì?", "options": ["A. Xác suất mô hình dự đoán chính xác tuyệt đối là 75%.", "B. Có 75% các quan sát nằm chính xác trên đường hồi quy.", "C. 75% sự biến thiên của biến phụ thuộc Y được giải thích bởi biến độc lập X trong mô hình.", "D. Hệ số tương quan r bắt buộc phải bằng +0.75."], "correct": [2], "explanation": "$R^2$ đo lường tỷ lệ phần trăm phương sai của Y được giải thích bởi các biến độc lập trong mô hình (1 - SS_res / SS_tot).", "multiple": false}, {"id": "w04_q023", "week": 4, "topic": "Python: plotnine và geom_smooth", "difficulty": "medium", "question": "Trong thư viện plotnine (Python), lớp nào sau đây được dùng để vẽ đường thẳng hồi quy OLS cùng dải khoảng tin cậy?", "options": ["A. geom_line()", "B. geom_smooth(method='lm')", "C. geom_regression()", "D. geom_abline(slope=1, intercept=0)"], "correct": [1], "explanation": "`geom_smooth(method='lm')` trong plotnine (và ggplot2) fit và vẽ đường mô hình tuyến tính (linear model) cùng dải băng sai số chuẩn.", "multiple": false}, {"id": "w04_q024", "week": 4, "topic": "Tính toán hệ số đường hồi quy", "difficulty": "medium", "question": "Cho $\\bar{x}$ = 10, s_x = 2, ȳ = 50, s_y = 6 và $r = 0.5$. Phương trình hồi quy ŷ = b0 + b1*x là:", "options": ["A. ŷ = 35 + 1.5x", "B. ŷ = 50 + 0.5x", "C. ŷ = 20 + 3.0x", "D. ŷ = 15 + 1.5x"], "correct": [0], "explanation": "b1 = r * (s_y / s_x) = 0.5 * (6 / 2) = 1.5. Hệ số chặn b0 = ȳ - b1 * $\\bar{x}$ = 50 - 1.5 * 10 = 50 - 15 = 35. Vậy phương trình là ŷ = 35 + 1.5x.", "multiple": false}, {"id": "w04_q025", "week": 4, "topic": "Hồi quy đa biến và biến gây nhiễu", "difficulty": "medium", "question": "Hồi quy đơn biến: Điểm thi = 6.0 - 0.5 * Giờ chơi game (hệ số âm).\nKhi đưa thêm biến 'Giờ tự học' vào mô hình hồi quy đa biến, hệ số của 'Giờ chơi game' chuyển thành 0.0 (không còn ảnh hưởng). Điều này giải thích hiện tượng gì?", "options": ["A. Giờ tự học là biến gây nhiễu/trung gian (omitted variable); người chơi game nhiều thường tự học ít, sự sụt giảm điểm thi thực chất là do thiếu giờ tự học.", "B. Chơi game giúp tăng điểm thi.", "C. Mô hình hồi quy đa biến bị sai thuật toán.", "D. Không thể đưa 2 biến vào cùng một mô hình."], "correct": [0], "explanation": "Đây là vai trò của việc kiểm soát biến (controlling for confounders). Mối tương quan âm ban đầu giữa chơi game và điểm thi bị chi phối bởi biến bị bỏ sót là giờ tự học.", "multiple": false}, {"id": "w04_q026", "week": 4, "topic": "Quan hệ phi tuyến và tương quan r", "difficulty": "hard", "question": "Xét tập dữ liệu 5 điểm: (-2, 4), (-1, 1), (0, 0), (1, 1), (2, 4), tuân theo đúng quan hệ parabol $Y = X^2$. Hệ số tương quan Pearson r giữa X và Y bằng bao nhiêu?", "options": ["A. $r = 1.0$ (vì có quan hệ toán học hoàn hảo)", "B. $r = 0.0$", "C. $r = 0.5$", "D. r = -1.0"], "correct": [1], "explanation": "X đối xứng qua 0: $\\bar{x}$ = 0, tích x_i * y_i gồm: (-2)*4 + (-1)*1 + 0 + 1*1 + 2*4 = -8 - 1 + 0 + 1 + 8 = 0. Suy ra $Cov(X, Y)$ = 0 và $r = 0$. Đây là ví dụ kinh điển: hai biến có quan hệ hàm số xác định hoàn hảo nhưng $r = 0$ vì quan hệ phi tuyến đối xứng.", "multiple": false}, {"id": "w04_q027", "week": 4, "topic": "Phương sai phần dư và R²", "difficulty": "hard", "question": "Tổng bình phương toàn phần SS_tot = $\\sum$ $(y_i - \\bar{y})^2$ có thể phân rã thành SS_reg (tổng bình phương hồi quy) và SS_res (tổng bình phương phần dư) theo công thức nào?", "options": ["A. SS_tot = SS_reg + SS_res", "B. SS_tot = SS_reg - SS_res", "C. SS_tot = SS_reg * SS_res", "D. SS_tot = SS_res / SS_reg"], "correct": [0], "explanation": "Định lý phân rã phương sai trong OLS: SS_tot = SS_reg + SS_res, nghĩa là toàn bộ độ biến thiên của Y được tách bạch thành: phần được mô hình giải thích (SS_reg) và phần nhiễu không giải thích được (SS_res).", "multiple": false}, {"id": "w04_q028", "week": 4, "topic": "Hệ số góc, tương quan và độ lệch chuẩn", "difficulty": "hard", "question": "Trong hồi quy tuyến tính đơn, hệ số góc ước lượng có thể viết thành $b_1=r\\,\\frac{s_y}{s_x}$. Cho $r=0.6$, $s_x=2$ và $s_y=5$. Hệ số góc $b_1$ bằng bao nhiêu?", "options": ["A. 0,24.", "B. 1,5.", "C. 3.", "D. 6."], "correct": [1], "explanation": "$b_1=0.6\\times(5/2)=1.5$.", "multiple": false}, {"id": "w04_q029", "week": 4, "topic": "Diễn giải hệ số trong hồi quy đa biến", "difficulty": "hard", "question": "Mô hình hồi quy dự đoán điểm thi từ số giờ học và số buổi nghỉ: $\\widehat{score}=50+3\\,hours-2\\,absences$. Diễn giải nào đúng cho hệ số 3 của `hours`?", "options": ["A. Khi số giờ học tăng 1 giờ, điểm dự đoán tăng 3 điểm nếu giữ số buổi nghỉ không đổi.", "B. Khi số giờ học tăng 1 giờ, điểm thực tế của mọi sinh viên chắc chắn tăng 3 điểm.", "C. Sinh viên học nhiều hơn luôn có điểm cao hơn, bất kể số buổi nghỉ.", "D. Hệ số 3 là tỷ lệ tương quan giữa điểm và số giờ học."], "correct": [0], "explanation": "Trong hồi quy đa biến, hệ số của một biến giải thích được diễn giải khi giữ các biến giải thích còn lại không đổi. Đây là diễn giải của giá trị khớp, không phải khẳng định nhân quả hay dự báo chính xác cho từng cá nhân.", "multiple": false}, {"id": "w04_q030", "week": 4, "topic": "Ảnh hưởng của Outlier: Leverage vs Influence", "difficulty": "hard", "question": "Phân biệt giữa Điểm có đòn bẩy cao (High leverage point) và Điểm có ảnh hưởng lớn (Influential point) trong hồi quy:", "options": ["A. Hai khái niệm này là hoàn toàn đồng nghĩa.", "B. Điểm có đòn bẩy cao có giá trị x nằm rất xa tâm $\\bar{x}$; nó chỉ trở thành điểm có ảnh hưởng lớn (influential) nếu nó làm thay đổi đáng kể độ dốc của đường hồi quy khi bị loại bỏ.", "C. Điểm đòn bẩy cao luôn có phần dư bằng 0.", "D. Điểm có ảnh hưởng là điểm có $x = 0$."], "correct": [1], "explanation": "Leverage thuần túy phụ thuộc vào vị trí của x (cách xa $\\bar{x}$). Nếu điểm đó vẫn nằm ngay trên quỹ đạo của đường thẳng hiện tại thì nó có high leverage nhưng low influence. Nếu nó lệch hẳn quỹ đạo, nó sẽ kéo giật đường thẳng (influential).", "multiple": false}, {"id": "w04_q031", "week": 4, "topic": "Biến chỉ báo và hai đường hồi quy song song", "difficulty": "hard", "question": "Một mô hình hồi quy có biến giải thích liên tục $x$ và biến chỉ báo $D\\in\\{0,1\\}$: $\\hat y=b_0+b_1x+b_2D$. Mô hình này hàm ý điều gì về hai nhóm $D=0$ và $D=1$?", "options": ["A. Hai nhóm có cùng hệ số chặn và khác hệ số góc.", "B. Hai nhóm có cùng hệ số góc và có thể khác hệ số chặn.", "C. Hai nhóm bắt buộc có cùng một đường hồi quy.", "D. Mô hình không thể có biến giải thích phân loại."], "correct": [1], "explanation": "Với $D=0$, đường hồi quy là $b_0+b_1x$; với $D=1$, đường là $(b_0+b_2)+b_1x$. Hai đường có cùng hệ số góc $b_1$ nên song song, còn hệ số chặn có thể khác nhau. Đây là trường hợp không có tương tác được minh họa trong slide tuần 04.", "multiple": false}, {"id": "w04_q032", "week": 4, "topic": "Hệ số tương quan và Hoán vị biến", "difficulty": "hard", "question": "Nếu ta đổi vai trò của hai biến: hồi quy X theo Y thay vì Y theo X. Đại lượng nào sau đây KHÔNG THAY ĐỔI?", "options": ["A. Hệ số góc của đường hồi quy.", "B. Hệ số chặn của đường hồi quy.", "C. Hệ số tương quan Pearson r và hệ số xác định $R^2$.", "D. Phương sai của phần dư."], "correct": [2], "explanation": "Tương quan Pearson r mang tính đối xứng hoàn toàn giữa X và Y: r(X, Y) = r(Y, X), do đó $R^2$ không đổi. Hệ số góc b1 = r*(s_y/s_x) sẽ đổi thành b1' = r*(s_x/s_y) nên thay đổi hoàn toàn.", "multiple": false}, {"id": "w04_q033", "week": 4, "topic": "Chẩn đoán độ phân tán từ biểu đồ phần dư", "difficulty": "hard", "question": "Trên biểu đồ phần dư theo giá trị dự đoán, các điểm tạo thành dạng chiếc phễu: độ phân tán của phần dư tăng dần khi giá trị dự đoán tăng. Nhận xét mô tả nào phù hợp nhất?", "options": ["A. Mức độ phân tán quanh đường hồi quy không giống nhau trên toàn miền dự đoán.", "B. Quan hệ giữa hai biến chắc chắn là nhân quả.", "C. Đường hồi quy có hệ số góc bằng 0.", "D. Tất cả phần dư đều bằng 0."], "correct": [0], "explanation": "Dạng phễu cho thấy độ biến thiên của phần dư thay đổi theo giá trị dự đoán. Biểu đồ phần dư là công cụ chẩn đoán cấu trúc còn sót lại, không tự chứng minh quan hệ nhân quả.", "multiple": false}, {"id": "w04_q034", "week": 4, "topic": "Tiêu chuẩn bình phương tối thiểu", "difficulty": "hard", "question": "Trong hồi quy tuyến tính đơn, phương pháp bình phương tối thiểu chọn đường thẳng bằng cách nào?", "options": ["A. Tối thiểu hóa tổng giá trị tuyệt đối của các giá trị dự đoán.", "B. Tối thiểu hóa tổng bình phương phần dư $\\sum_i(y_i-\\hat y_i)^2$.", "C. Tối đa hóa tổng phần dư có dấu.", "D. Buộc mọi điểm dữ liệu phải nằm đúng trên đường thẳng."], "correct": [1], "explanation": "OLS chọn hệ số để tổng bình phương phần dư nhỏ nhất. Phần dư là chênh lệch giữa giá trị quan sát và giá trị khớp; nói chung không phải mọi phần dư đều bằng 0.", "multiple": false}, {"id": "w04_q035", "week": 4, "topic": "Python / statsmodels", "difficulty": "hard", "question": "Đoạn code nào sau đây ước lượng mô hình hồi quy tuyến tính OLS y theo x trong Python bằng thư viện statsmodels theo cú pháp công thức (formula)?", "options": ["A. smf.ols('y ~ x', data=df).fit()", "B. sm.linear_model(y, x).run()", "C. df.regress('y', 'x')", "D. statsmodels.fit_line(x, y)"], "correct": [0], "explanation": "`statsmodels.formula.api` cung cấp hàm `ols('y ~ x', data=df).fit()` với cú pháp dạng formula tương tự như ngôn ngữ R.", "multiple": false}, {"id": "w05_q001", "week": 5, "topic": "Tiên đề Kolmogorov", "difficulty": "easy", "question": "Theo hệ tiên đề xác suất Kolmogorov, khẳng định nào sau đây là ĐÚNG?", "options": ["A. Xác suất của một biến cố bất kỳ có thể là một số âm.", "B. Xác suất của không gian mẫu P(Ω) = 1.", "C. P(A ∪ B) luôn luôn bằng P(A) + P(B) với mọi biến cố A và B bất kỳ.", "D. Xác suất của biến cố rỗng P(∅) = 0.5."], "correct": [1], "explanation": "Tiên đề Kolmogorov quy định: 1) P(A) ≥ 0; 2) P(Ω) = 1; 3) Tính cộng xác suất áp dụng cho các biến cố xung khắc nhau.", "multiple": false}, {"id": "w05_q002", "week": 5, "topic": "Xác suất của biến cố bù", "difficulty": "easy", "question": "Nếu xác suất trời mưa vào ngày mai là P(Mưa) = 0.35, xác suất trời KHÔNG mưa vào ngày mai là bao nhiêu?", "options": ["A. 0.35", "B. 0.65", "C. 0.70", "D. 1.00"], "correct": [1], "explanation": "P(A^c) = 1 - P(A) = 1 - 0.35 = 0.65.", "multiple": false}, {"id": "w05_q003", "week": 5, "topic": "Xác suất có điều kiện", "difficulty": "easy", "question": "Công thức định nghĩa xác suất có điều kiện của biến cố A khi biết biến cố B đã xảy ra (với P(B) > 0) là gì?", "options": ["A. P(A|B) = P(A ∩ B) / P(B)", "B. P(A|B) = P(A ∩ B) / P(A)", "C. P(A|B) = P(A) * P(B)", "D. P(A|B) = P(A ∪ B) - P(B)"], "correct": [0], "explanation": "Xác suất có điều kiện được định nghĩa bởi: P(A|B) = P(A ∩ B) / P(B).", "multiple": false}, {"id": "w05_q004", "week": 5, "topic": "Biến cố độc lập", "difficulty": "easy", "question": "Hai biến cố A và B được gọi là ĐỘC LẬP với nhau khi và chỉ khi điều kiện nào sau đây thỏa mãn?", "options": ["A. P(A ∩ B) = 0", "B. P(A ∩ B) = P(A) * P(B)", "C. P(A ∪ B) = 1", "D. P(A) + P(B) = 1"], "correct": [1], "explanation": "Định nghĩa toán học của tính độc lập: P(A ∩ B) = P(A) * P(B) (hoặc tương đương P(A|B) = P(A)).", "multiple": false}, {"id": "w05_q005", "week": 5, "topic": "Biến cố xung khắc", "difficulty": "easy", "question": "Hai biến cố A và B được gọi là XUNG KHẮC (Mutually Exclusive / Disjoint) khi nào?", "options": ["A. Chúng không thể cùng xảy ra trong một phép thử: A ∩ B = ∅ và P(A ∩ B) = 0.", "B. Biến cố này xảy ra không làm thay đổi xác suất biến cố kia.", "C. P(A) = P(B).", "D. A ∪ B = Ω."], "correct": [0], "explanation": "Hai biến cố xung khắc là hai biến cố không có phần tử chung (A ∩ B = ∅), nghĩa là không bao giờ cùng đồng thời xảy ra.", "multiple": false}, {"id": "w05_q006", "week": 5, "topic": "Quy tắc cộng xác suất", "difficulty": "easy", "question": "Nếu hai biến cố A và B xung khắc nhau với P(A) = 0.2 và P(B) = 0.5, xác suất để A hoặc B xảy ra P(A ∪ B) là bao nhiêu?", "options": ["A. 0.10", "B. 0.70", "C. 0.30", "D. 0.60"], "correct": [1], "explanation": "Vì A và B xung khắc (P(A ∩ B) = 0), quy tắc cộng cho: P(A ∪ B) = P(A) + P(B) = 0.2 + 0.5 = 0.7.", "multiple": false}, {"id": "w05_q007", "week": 5, "topic": "Ngụy biện của con bạc", "difficulty": "easy", "question": "Tung một đồng xu cân đối đồng chất 5 lần liên tiếp và cả 5 lần đều xuất hiện mặt Ngửa. Xác suất để lần tung thứ 6 xuất hiện mặt Ngửa là bao nhiêu?", "options": ["A. Rất nhỏ (gần bằng 0) vì đồng xu phải cân bằng lại.", "B. Chính xác bằng 0.5 (1/2) vì các lần tung là độc lập nhau.", "C. Lớn hơn 0.5 vì đồng xu đang có đà may mắn.", "D. 1/64"], "correct": [1], "explanation": "Đồng xu không có bộ nhớ (tính độc lập giữa các lần thử). Xác suất lần thứ 6 ra Ngửa vẫn là $1/2 = 0.5.$Nghĩ rằng lần sau phải ra Sấp để bù lại là 'Ngụy biện của con bạc' (Gambler's fallacy).", "multiple": false}, {"id": "w05_q008", "week": 5, "topic": "Định lý Bayes cơ bản", "difficulty": "easy", "question": "Trong công thức Bayes, xác suất ban đầu P(H) trước khi quan sát dữ liệu mới được gọi là gì, và xác suất P(H|D) sau khi đã cập nhật dữ liệu được gọi là gì?", "options": ["A. P(H) là xác suất hậu nghiệm (Posterior); P(H|D) là xác suất tiền nghiệm (Prior).", "B. P(H) là xác suất tiền nghiệm (Prior); P(H|D) là xác suất hậu nghiệm (Posterior).", "C. Cả hai đều là độ tin cậy thực nghiệm.", "D. P(H) là xác suất biên duyên; P(H|D) là tỷ lệ sai sót."], "correct": [1], "explanation": "P(H) là Prior (niềm tin/xác suất tiền nghiệm trước khi có dữ liệu); P(H|D) là Posterior (xác suất hậu nghiệm sau khi quan sát bằng chứng D).", "multiple": false}, {"id": "w05_q009", "week": 5, "topic": "Quy tắc cộng tổng quát", "difficulty": "easy", "question": "Quy tắc cộng tổng quát cho hai biến cố bất kỳ A và B là:", "options": ["A. P(A ∪ B) = P(A) + P(B)", "B. P(A ∪ B) = P(A) + P(B) - P(A ∩ B)", "C. P(A ∪ B) = P(A) * P(B)", "D. P(A ∪ B) = P(A) + P(B) + P(A ∩ B)"], "correct": [1], "explanation": "Để tránh bị đếm lặp 2 lần phần giao A ∩ B, ta phải trừ đi phần giao: P(A ∪ B) = P(A) + P(B) - P(A ∩ B).", "multiple": false}, {"id": "w05_q010", "week": 5, "topic": "Nghịch lý Chevalier De Méré 1", "difficulty": "medium", "question": "Tung một con xúc xắc cân đối 6 mặt liên tiếp 4 lần độc lập. Xác suất để có ÍT NHẤT một lần xuất hiện mặt 6 chấm là bao nhiêu?", "options": ["A. 4 * (1/6) = 2/3 ≈ 0.667", "B. 1 - (5/6)⁴ = 1 - 625/1296 ≈ 0.5177", "C. (1/6)⁴ ≈ 0.00077", "D. 0.5000"], "correct": [1], "explanation": "Xác suất không có lần nào mặt 6 trong 4 lần tung là (5/6)⁴ = 625/1296. Xác suất có ít nhất một mặt 6 là biến cố bù: 1 - (5/6)⁴ ≈ 0.5177 > 0.5 (đây là trò cược mà Chevalier de Méré có lãi).", "multiple": false}, {"id": "w05_q011", "week": 5, "topic": "Nghịch lý Chevalier De Méré 2", "difficulty": "medium", "question": "Tung một cặp xúc xắc cân đối (2 con xúc xắc) liên tiếp 24 lần. Xác suất để có ít nhất một lần xuất hiện cặp (6, 6) là bao nhiêu, và Chevalier De Méré cược cửa này sẽ lãi hay lỗ về lâu dài?", "options": ["A. P = $24/36 = 2/3$; De Méré lãi lớn.", "B. P = 1 - $\\left(\\frac{35}{36}\\right)^{2}$⁴ ≈ 0.4914; Xác suất nhỏ hơn 0.5 nên về lâu dài De Méré bị lỗ vốn.", "C. P = 1 - $\\left(\\frac{35}{36}\\right)^{2}$⁴ ≈ 0.5177; De Méré lãi tương tự bài toán 4 lần.", "D. P = 0.5000; Hòa vốn."], "correct": [1], "explanation": "Xác suất không ra (6,6) ở 1 lần tung là 35/36. Sau 24 lần, xác suất không lần nào ra (6,6) là $\\left(\\frac{35}{36}\\right)^{2}$⁴ ≈ 0.5086. Xác suất có ít nhất 1 lần ra (6,6) là 1 - 0.5086 = 0.4914 < 0.5, do đó De Méré bị thua tiền.", "multiple": false}, {"id": "w05_q012", "week": 5, "topic": "Xung khắc vs Độc lập", "difficulty": "medium", "question": "Giả sử hai biến cố A và B đều có xác suất dương: P(A) > 0 và P(B) > 0. Nếu A và B XUNG KHẮC nhau thì chúng có ĐỘC LẬP với nhau không?", "options": ["A. Có, hai biến cố xung khắc luôn độc lập.", "B. KHÔNG THỂ độc lập; thực tế chúng phụ thuộc nhau tối đa vì nếu A xảy ra thì B chắc chắn KHÔNG THỂ xảy ra (P(B|A) = 0 ≠ P(B)).", "C. Tùy thuộc vào việc tung đồng xu hay xúc xắc.", "D. Độc lập chỉ khi P(A) + P(B) = 1."], "correct": [1], "explanation": "Đây là một bẫy kinh điển: Nếu A ∩ B = ∅ thì P(A ∩ B) = 0. Nhưng vì P(A) > 0 và P(B) > 0 nên P(A)*P(B) > 0 ≠ 0. Do đó hai biến cố xung khắc có xác suất dương KHÔNG BAO GIỜ độc lập.", "multiple": false}, {"id": "w05_q013", "week": 5, "topic": "Công thức xác suất toàn phần", "difficulty": "medium", "question": "Một nhà máy có 2 dây chuyền: Dây chuyền 1 sản xuất 60% sản phẩm với tỷ lệ phế phẩm 2%; Dây chuyền 2 sản xuất 40% sản phẩm với tỷ lệ phế phẩm 5%. Lấy ngẫu nhiên 1 sản phẩm của nhà máy, xác suất sản phẩm đó là phế phẩm là bao nhiêu?", "options": ["A. 3.5%", "B. 0.60 * 0.02 + 0.40 * 0.05 = 0.012 + 0.020 = 0.032 (3.2%)", "C. 7.0%", "D. 2.8%"], "correct": [1], "explanation": "Theo công thức xác suất toàn phần: P(Lỗi) = P(D1)*P(Lỗi|D1) + P(D2)*P(Lỗi|D2) = 0.60 * 0.02 + 0.40 * 0.05 = 0.012 + 0.020 = 0.032 (3.2%).", "multiple": false}, {"id": "w05_q014", "week": 5, "topic": "Định lý Bayes tính toán", "difficulty": "medium", "question": "Tiếp tục bài toán trên: Nếu kiểm tra thấy sản phẩm lấy ra BỊ LỖI (phế phẩm), xác suất sản phẩm đó do Dây chuyền 2 sản xuất là bao nhiêu?", "options": ["A. 40.0%", "B. 0.020 / 0.032 = 62.5%", "C. 50.0%", "D. 37.5%"], "correct": [1], "explanation": "Theo định lý Bayes: P(D2 | Lỗi) = [P(D2) * P(Lỗi|D2)] / P(Lỗi) = 0.020 / 0.032 = $5/8 = 62.5$%.", "multiple": false}, {"id": "w05_q015", "week": 5, "topic": "Quy tắc nhân", "difficulty": "medium", "question": "Một hộp có 5 viên bi đỏ và 3 viên bi xanh. Rút ngẫu nhiên lần lượt 2 viên bi KHÔNG HOÀN LẠI. Xác suất để cả hai viên bi đều màu đỏ là bao nhiêu?", "options": ["A. (5/8) * (5/8) = 25/64", "B. (5/8) * (4/7) = $20/56 = 5/14$≈ 0.357", "C. 5/8 + 4/7", "D. $2/8 = 1/4$"], "correct": [1], "explanation": "Rút không hoàn lại nên số lượng bi giảm dần: Viên 1 đỏ có xác suất 5/8; khi đã rút 1 viên đỏ, trong hộp còn 4 viên đỏ trên tổng số 7 viên. P(Đ1 ∩ Đ2) = (5/8) * (4/7) = 5/14.", "multiple": false}, {"id": "w05_q016", "week": 5, "topic": "Biến cố đối nhau vs Xung khắc", "difficulty": "medium", "question": "Phát biểu nào sau đây phân biệt ĐÚNG giữa hai biến cố đối nhau và hai biến cố xung khắc?", "options": ["A. Hai biến cố đối nhau thì luôn xung khắc, nhưng hai biến cố xung khắc chưa chắc đã đối nhau.", "B. Hai biến cố xung khắc thì luôn đối nhau.", "C. Hai khái niệm này hoàn toàn tương đương nhau.", "D. Hai biến cố đối nhau không thể xung khắc."], "correct": [0], "explanation": "Hai biến cố đối nhau thỏa mãn: A ∩ B = ∅ (xung khắc) VÀ A ∪ B = Ω. Hai biến cố chỉ cần A ∩ B = ∅ là đã xung khắc, chưa cần hợp lại thành toàn bộ không gian mẫu (ví dụ: tung xúc xắc, A là mặt 1, B là mặt 2: xung khắc nhưng không đối nhau).", "multiple": false}, {"id": "w05_q017", "week": 5, "topic": "Quy tắc De Morgan", "difficulty": "medium", "question": "Theo luật De Morgan trong lý thuyết xác suất, phần bù của biến cố hợp (A ∪ B)^c bằng biểu thức nào?", "options": ["A. A^c ∪ B^c", "B. A^c ∩ B^c (Không có A VÀ không có B)", "C. Ω ∖ (A ∩ B)", "D. A ∩ B"], "correct": [1], "explanation": "Luật De Morgan: (A ∪ B)^c = A^c ∩ B^c (Không xảy ra A và cũng không xảy ra B); và (A ∩ B)^c = A^c ∪ B^c.", "multiple": false}, {"id": "w05_q018", "week": 5, "topic": "Quy tắc cộng 3 biến cố", "difficulty": "medium", "question": "Công thức xác suất của hợp 3 biến cố P(A ∪ B ∪ C) được khai triển theo nguyên lý bù trừ (Inclusion-Exclusion) như thế nào?", "options": ["A. P(A) + P(B) + P(C)", "B. P(A) + P(B) + P(C) - P(AB) - P(BC) - P(CA) + P(ABC)", "C. P(A) + P(B) + P(C) - P(ABC)", "D. P(A) * P(B) * P(C)"], "correct": [1], "explanation": "Nguyên lý bù trừ: Cộng tổng các xác suất đơn lẻ, trừ đi tổng các phần giao đôi một, và cộng lại phần giao của cả ba: P(A)+P(B)+P(C) - [P(AB)+P(BC)+P(CA)] + P(ABC).", "multiple": false}, {"id": "w05_q019", "week": 5, "topic": "Bẫy tỉ lệ nền (Base Rate Neglect)", "difficulty": "medium", "question": "Một căn bệnh hiếm gặp có tỷ lệ mắc trong cộng đồng là 1/1.000 (0.1%). Một que thử có độ nhạy 99% (nếu có bệnh thì 99% báo dương) và độ đặc hiệu 95% (nếu không bệnh thì 95% báo âm, tức 5% dương tính giả). Một người được xét nghiệm ngẫu nhiên và nhận kết quả DƯƠNG TÍNH. Xác suất thực tế người này mắc bệnh là khoảng bao nhiêu?", "options": ["A. Khoảng 99%", "B. Khoảng 95%", "C. Khoảng 2% (nhỏ hơn 5%)", "D. Khoảng 50%"], "correct": [2], "explanation": "Trong 100.000 người: có 100 người bệnh -> test đúng 99 người; có 99.900 người khỏe -> test nhầm 5% * 99.900 = 4.995 người. Tổng số người dương tính = 99 + 4995 = 5.094. Tỷ lệ thực sự có bệnh khi dương tính = 99 / 5.094 ≈ 1.94% (< 2%). Do bệnh quá hiếm, dương tính giả áp đảo dương tính thật!", "multiple": false}, {"id": "w05_q020", "week": 5, "topic": "Sơ đồ cây (Tree Diagram)", "difficulty": "medium", "question": "Khi dựng sơ đồ cây xác suất đa tầng, xác suất tương ứng trên một nhánh rẽ ở tầng 2 là loại xác suất nào?", "options": ["A. Xác suất biên duyên P(B)", "B. Xác suất có điều kiện P(B | A) với A là nhánh dẫn đến nó từ tầng 1", "C. Xác suất đồng thời P(A ∩ B)", "D. Xác suất hậu nghiệm P(A | B)"], "correct": [1], "explanation": "Trên các nhánh rẽ của sơ đồ cây, các giá trị ghi trên nhánh là xác suất có điều kiện bước tiếp theo biết nhánh trước đã chọn. Tích các nhánh dọc một con đường từ gốc đến lá mới là xác suất đồng thời.", "multiple": false}, {"id": "w05_q021", "week": 5, "topic": "Độc lập đôi một vs Độc lập toàn thể", "difficulty": "medium", "question": "Ba biến cố A, B, C độc lập đôi một (pairwise independent) có nhất thiết độc lập toàn phần (mutually independent) không?", "options": ["A. Luôn luôn tương đương nhau.", "B. Không nhất thiết; để độc lập toàn phần cần thêm điều kiện P(A ∩ B ∩ C) = P(A)*P(B)*P(C).", "C. Độc lập toàn phần chỉ cần 2 biến cố độc lập là đủ.", "D. Ba biến cố thì không thể độc lập."], "correct": [1], "explanation": "Độc lập đôi một không đảm bảo độc lập toàn phần (ví dụ kinh điển về việc tung 2 đồng xu với biến cố A: xu 1 ngửa, B: xu 2 ngửa, C: hai xu cùng mặt).", "multiple": false}, {"id": "w05_q022", "week": 5, "topic": "Mô phỏng xác suất trong Python", "difficulty": "medium", "question": "Đoạn code Python nào sau đây mô phỏng chính xác việc tung một con xúc xắc 6 mặt cân đối 10.000 lần và tính tần suất xuất hiện mặt 6?", "options": ["A. `import numpy as np; rolls = np.random.randint(1, 7, 10000); print(np.mean(rolls == 6))`", "B. `import random; print(random.choice([1, 6]))`", "C. `rolls = [6] * 10000; print(sum(rolls))`", "D. `np.random.normal(6, 1, 10000).mean()`"], "correct": [0], "explanation": "`np.random.randint(1, 7, 10000)` sinh 10.000 số nguyên ngẫu nhiên từ 1 đến 6. `rolls == 6` tạo mảng boolean, và `np.mean(...)` tính tỷ lệ phần trăm các lần xuất hiện mặt 6 (xấp xỉ 1/6 ≈ 0.1667).", "multiple": false}, {"id": "w05_q023", "week": 5, "topic": "Tính chất xác suất có điều kiện", "difficulty": "medium", "question": "Cho P(A) = 0.4, P(B) = 0.5 và P(A ∩ B) = 0.2. Tính P(B | A) và cho biết A, B có độc lập không?", "options": ["A. P(B | A) = 0.5; A và B độc lập.", "B. P(B | A) = 0.4; A và B phụ thuộc.", "C. P(B | A) = 0.2; A và B độc lập.", "D. P(B | A) = 0.8; A và B phụ thuộc."], "correct": [0], "explanation": "P(B | A) = P(A ∩ B) / P(A) = 0.2 / 0.4 = 0.5. Ta thấy P(B | A) = 0.5 = P(B), đồng thời P(A ∩ B) = 0.2 = 0.4 * 0.5 = P(A)*P(B), do đó A và B là hai biến cố độc lập.", "multiple": false}, {"id": "w05_q024", "week": 5, "topic": "Biến cố hiệu", "difficulty": "medium", "question": "Biến cố 'A xảy ra nhưng B KHÔNG xảy ra' được biểu diễn bằng phép toán tập hợp và công thức tính xác suất nào?", "options": ["A. A ∖ B và P(A ∖ B) = P(A) - P(A ∩ B)", "B. A ∩ B và P(A ∩ B) = P(A) - P(B)", "C. A ∪ B và P(A ∪ B) = P(A) + P(B)", "D. B ∖ A và P(B ∖ A) = P(B) - P(A)"], "correct": [0], "explanation": "Biến cố A xảy ra và B không xảy ra là A ∩ B^c (hay A ∖ B). Xác suất P(A ∖ B) = P(A) - P(A ∩ B).", "multiple": false}, {"id": "w05_q025", "week": 5, "topic": "Hệ đầy đủ các biến cố", "difficulty": "medium", "question": "Một họ các biến cố {B1, B2, ..., Bn} được gọi là một hệ đầy đủ (hoặc một phân hoạch của không gian mẫu Ω) nếu thỏa mãn điều kiện nào?", "options": ["A. Các biến cố xung khắc từng đôi một (Bi ∩ Bj = ∅ với mọi i ≠ j) và hợp của chúng phủ kín không gian mẫu (⋃ Bi = Ω).", "B. Tất cả các biến cố đều có xác suất bằng nhau.", "C. Tổng xác suất của chúng lớn hơn 1.", "D. Các biến cố phải độc lập từng đôi một."], "correct": [0], "explanation": "Một phân hoạch (hệ đầy đủ) chia không gian mẫu thành các mảnh rời nhau không chồng lấn và hợp lại thành toàn bộ Ω.", "multiple": false}, {"id": "w05_q026", "week": 5, "topic": "Vụ án Sally Clark và Ngụy biện công tố viên", "difficulty": "hard", "question": "Trong vụ án oan nổi tiếng của Sally Clark (người mẹ có 2 con sơ sinh chết đột tử - SIDS), chuyên gia y tế đã tính xác suất cả 2 con cùng chết đột tử bằng cách lấy: (1/8500) * (1/8500) ≈ 1/73.000.000 và kết luận bà ta hầu như chắc chắn có tội giết người. Hai sai lầm xác suất nghiêm trọng nhất ở đây là gì? Chọn mã đáp án gồm chính xác tất cả các nhận định đúng.\n\nCác nhận định:\n- (1) Giả định tính độc lập sai lầm: hai đứa trẻ trong cùng gia đình có chung mã gen di truyền và môi trường sống, nguy cơ SIDS ở trẻ thứ 2 cao gấp nhiều lần khi trẻ thứ 1 đã mắc.\n- (2) Ngụy biện của công tố viên (Prosecutor's fallacy): nhầm lẫn giữa xác suất vô tội khi có 2 trẻ chết P(Vô tội | 2 chết) với xác suất 2 trẻ chết tự nhiên P(2 chết | Vô tội). Tội ác giết 2 con còn hiếm hơn SIDS gấp nhiều lần.\n- (3) Tính sai số học phép nhân.\n- (4) Không sử dụng thư viện pandas để vẽ biểu đồ hộp.\n\nMã đáp án:", "options": ["A. (1), (2)", "B. (1), (3)", "C. (2), (3)", "D. (3), (4)"], "correct": [0], "explanation": "Sai lầm gồm giả định hai ca SIDS độc lập dù có yếu tố nguy cơ chung, và ngụy biện công tố viên: nhầm P(2 ca tự nhiên | vô tội) với P(vô tội | 2 ca).", "multiple": false}, {"id": "w05_q027", "week": 5, "topic": "Quy tắc xác suất toàn phần", "difficulty": "hard", "question": "Một cửa hàng nhập 60% sản phẩm từ nhà cung cấp A và 40% từ nhà cung cấp B. Tỷ lệ sản phẩm lỗi của A là 2%, của B là 5%. Chọn ngẫu nhiên một sản phẩm. Xác suất sản phẩm đó bị lỗi là bao nhiêu?", "options": ["A. $0.60\\times0.02+0.40\\times0.05=0.032$ (3,2%).", "B. $0.60\\times0.05+0.40\\times0.02=0.038$ (3,8%).", "C. $0.02+0.05=0.07$ (7%).", "D. $(0.02+0.05)/2=0.035$ (3,5%)."], "correct": [0], "explanation": "Hai nguồn A và B tạo thành một phân hoạch của các sản phẩm. Theo quy tắc xác suất toàn phần, $P(L)=P(L|A)P(A)+P(L|B)P(B)=0.032$.", "multiple": false}, {"id": "w05_q028", "week": 5, "topic": "Công thức cộng xác suất và phần giao", "difficulty": "hard", "question": "Có 30% sinh viên tham gia câu lạc bộ lập trình, 25% tham gia câu lạc bộ robotics và 10% tham gia cả hai. Xác suất một sinh viên tham gia ít nhất một trong hai câu lạc bộ là bao nhiêu?", "options": ["A. 65%.", "B. 55%.", "C. 45%.", "D. 15%."], "correct": [2], "explanation": "$P(A\\cup B)=P(A)+P(B)-P(A\\cap B)=0.30+0.25-0.10=0.45$.", "multiple": false}, {"id": "w05_q029", "week": 5, "topic": "Bài toán Simpson trong xác suất điều kiện", "difficulty": "hard", "question": "Cho các biến cố A, B, C. Có thể xảy ra trường hợp nào sau đây không?\nP(A | B ∩ C) > P(A | B^c ∩ C) VÀ P(A | B ∩ C^c) > P(A | B^c ∩ C^c) nhưng khi gộp lại thì P(A | B) < P(A | B^c)?", "options": ["A. Không thể, điều này vi phạm tiên đề xác suất.", "B. HOÀN TOÀN CÓ THỂ, đây chính là Nghịch lý Simpson phát biểu dưới ngôn ngữ xác suất điều kiện, do phân phối của biến điều kiện C khác nhau giữa B và B^c.", "C. Chỉ xảy ra khi P(C) = 0.", "D. Chỉ xảy ra trong không gian mẫu vô hạn."], "correct": [1], "explanation": "Nghịch lý Simpson biểu diễn bằng xác suất điều kiện hoàn toàn hợp lệ, do trọng số P(C|B) khác với P(C|B^c), tương tự như trung bình có trọng số.", "multiple": false}, {"id": "w05_q030", "week": 5, "topic": "Quy tắc nhân chuỗi (Chain Rule)", "difficulty": "hard", "question": "Công thức khai triển quy tắc nhân chuỗi cho giao của 4 biến cố P(A1 ∩ A2 ∩ A3 ∩ A4) là gì?", "options": ["A. P(A1) * P(A2|A1) * P(A3|A1 ∩ A2) * P(A4|A1 ∩ A2 ∩ A3)", "B. P(A1) + P(A2|A1) + P(A3|A2) + P(A4|A3)", "C. P(A1) * P(A2) * P(A3) * P(A4)", "D. P(A4 | A1)"], "correct": [0], "explanation": "Quy tắc nhân chuỗi: P(A1 ∩ ... ∩ An) = P(A1) * P(A2|A1) * P(A3|A1 ∩ A2) * ... * P(An|A1 ∩ ... ∩ An-1).", "multiple": false}, {"id": "w05_q031", "week": 5, "topic": "Phân biệt xác suất có điều kiện", "difficulty": "hard", "question": "Trong bảng hai chiều, 40% đơn hàng là cỡ nhỏ và 12% tổng số đơn hàng vừa là cỡ nhỏ vừa là cà phê đã khử caffeine. Xác suất một đơn hàng là cà phê đã khử caffeine khi biết đơn hàng đó cỡ nhỏ bằng bao nhiêu?", "options": ["A. $0.12/0.40=0.30$.", "B. $0.40/0.12=3.33$.", "C. $0.12$.", "D. $0.40+0.12=0.52$."], "correct": [0], "explanation": "$P(D|N)=P(D\\cap N)/P(N)=0.12/0.40=0.30$. Mẫu số phải là tỷ lệ của nhóm đã được điều kiện hóa (đơn hàng cỡ nhỏ).", "multiple": false}, {"id": "w05_q032", "week": 5, "topic": "Mô hình SIR và lây nhiễm", "difficulty": "hard", "question": "Trong mô hình lây lan dịch bệnh, một người khỏe mạnh tiếp xúc độc lập với 3 người F0. Mỗi lần tiếp xúc có xác suất lây bệnh là $p = 0.2$. Xác suất người này BỊ LÂY NHIỄM là bao nhiêu?", "options": ["A. 3 * 0.2 = 0.6", "B. 1 - $ $(1 - 0.2)^3$ $ = 1 - $0.8^{3}$ = 1 - 0.512 = 0.488 (48.8%)", "C. $0.2^{3}$ = 0.008", "D. 0.8"], "correct": [1], "explanation": "Xác suất không bị lây qua cả 3 lần tiếp xúc độc lập là $ $(1 - 0.2)^3$ $ = $0.8^{3}$ = 0.512. Xác suất bị lây nhiễm (ít nhất 1 lần lây) là 1 - 0.512 = 0.488.", "multiple": false}, {"id": "w05_q033", "week": 5, "topic": "Bài toán rút thăm công bằng", "difficulty": "hard", "question": "Một hộp có 10 lá thăm, trong đó chỉ có 1 lá thăm trúng thưởng. Ba người A, B, C lần lượt lên bốc thăm không hoàn lại (A bốc trước, đến B, rồi đến C). Xác suất bốc trúng lá thăm trúng thưởng của người thứ ba C là bao nhiêu?", "options": ["A. 1/8", "B. 1/10 (bằng chính xác xác suất của người bốc đầu tiên)", "C. 1/30", "D. Nhỏ hơn người A rất nhiều vì người A có cơ hội chọn trước."], "correct": [1], "explanation": "Đây là bài toán kinh điển về tính công bằng của bốc thăm không hoàn lại: P(C trúng) = P(A trượt ∩ B trượt ∩ C trúng) = (9/10) * (8/9) * (1/8) = 1/10. Mọi người đều có xác suất trúng 1/10 ngang nhau bất kể thứ tự bốc!", "multiple": false}, {"id": "w05_q034", "week": 5, "topic": "Định luật De Morgan", "difficulty": "hard", "question": "Với hai biến cố $A$ và $B$, phần bù của biến cố “$A$ hoặc $B$ xảy ra” được biểu diễn như thế nào?", "options": ["A. $A^c\\cup B^c$.", "B. $A^c\\cap B^c$.", "C. $A\\cap B$.", "D. $A\\cup B$."], "correct": [1], "explanation": "Theo định luật De Morgan, $(A\\cup B)^c=A^c\\cap B^c$: cả A và B đều không xảy ra.", "multiple": false}, {"id": "w05_q035", "week": 5, "topic": "Định lý Bayes", "difficulty": "hard", "question": "Một bệnh có tỷ lệ nền 1%. Một xét nghiệm cho kết quả dương tính ở 90% người mắc bệnh và ở 5% người không mắc bệnh. Nếu một người có kết quả dương tính, công thức nào tính xác suất người đó thực sự mắc bệnh?", "options": ["A. $\\frac{0.90\\times0.01}{0.90\\times0.01+0.05\\times0.99}$.", "B. $\\frac{0.05\\times0.99}{0.90\\times0.01}$.", "C. $0.90+0.01$.", "D. $0.90/0.05$."], "correct": [0], "explanation": "Áp dụng Bayes: $P(D|+)=\\frac{P(+|D)P(D)}{P(+|D)P(D)+P(+|D^c)P(D^c)}$. Tử số là xác suất vừa mắc bệnh vừa dương tính; mẫu số là xác suất dương tính theo quy tắc toàn phần.", "multiple": false}, {"id": "w06_q001", "week": 6, "topic": "Hàm khối xác suất (PMF)", "difficulty": "easy", "question": "Hàm khối xác suất (Probability Mass Function - PMF) $p_{X}(x)$ của biến ngẫu nhiên rời rạc X phải thỏa mãn hai điều kiện nào sau đây?", "options": ["A. $p_{X}(x)$ ≥ 0 với mọi x, và tổng $\\sum$ $p_{X}(x) = 1$ trên toàn bộ miền giá trị.", "B. $p_{X}(x)$ ≤ 1 và tích $\\prod$ $p_{X}(x) = 1.$", "C. $p_{X}(x)$ phải là hàm liên tục và đạo hàm bằng 0.", "D. $p_{X}(x)$ luôn nhận giá trị nguyên dương."], "correct": [0], "explanation": "Định nghĩa PMF: Mọi xác suất thành phần không âm ($p_{X}(x)$ ≥ 0) và tổng xác suất của toàn bộ các giá trị có thể nhận bằng đúng 1.", "multiple": false}, {"id": "w06_q002", "week": 6, "topic": "Hàm phân phối tích lũy (CDF)", "difficulty": "easy", "question": "Hàm phân phối tích lũy $F_{X}(x)$ của biến ngẫu nhiên X được định nghĩa là gì?", "options": ["A. $F_{X}(x)$ = P(X = x)", "B. $F_{X}(x)$ = P(X ≤ x)", "C. $F_{X}(x)$ = P(X > x)", "D. $F_{X}(x) = 1$ / P(X = x)"], "correct": [1], "explanation": "Hàm phân phối tích lũy CDF được định nghĩa là xác suất để biến ngẫu nhiên X nhận giá trị nhỏ hơn hoặc bằng x: $F_{X}(x)$ = P(X ≤ x).", "multiple": false}, {"id": "w06_q003", "week": 6, "topic": "Phân phối Bernoulli", "difficulty": "easy", "question": "Biến ngẫu nhiên Bernoulli X ~ Bern(p) có thể nhận những giá trị nào?", "options": ["A. Bất kỳ số nguyên nào từ 1 đến 6.", "B. Chỉ nhận hai giá trị 0 và 1 (thất bại hoặc thành công).", "C. Bất kỳ số thực nào trong đoạn [0, 1].", "D. Tập hợp các số nguyên không âm {0, 1, 2, ...}."], "correct": [1], "explanation": "Phân phối Bernoulli mô hình hóa một phép thử chỉ có 2 kết cục duy nhất: 1 (thành công với xác suất p) và 0 (thất bại với xác suất 1 - p).", "multiple": false}, {"id": "w06_q004", "week": 6, "topic": "Phân phối Nhị thức", "difficulty": "easy", "question": "Biến ngẫu nhiên X tuân theo phân phối Nhị thức Bin(n, p) biểu diễn đại lượng nào?", "options": ["A. Thời gian chờ đợi đến khi lần thành công đầu tiên xuất hiện.", "B. Số lần thành công trong n phép thử Bernoulli độc lập có cùng xác suất thành công p.", "C. Số lỗi xảy ra trong một giờ trên máy chủ.", "D. Số phép thử cần thực hiện để đạt được n lần thất bại."], "correct": [1], "explanation": "Phân phối nhị thức đếm số lần thành công k trong n phép thử độc lập có cùng xác suất p.", "multiple": false}, {"id": "w06_q005", "week": 6, "topic": "Phân phối Poisson", "difficulty": "easy", "question": "Phân phối Poisson với tham số $\\lambda$ thường được dùng để mô hình hóa đại lượng nào trong thực tế?", "options": ["A. Tung một đồng xu 1 lần.", "B. Số lượng biến cố hiếm xảy ra trong một khoảng thời gian hoặc không gian cố định (ví dụ: số cuộc gọi đến tổng đài trong 1 phút).", "C. Điểm thi tốt nghiệp THPT của học sinh.", "D. Chiều cao của sinh viên."], "correct": [1], "explanation": "Phân phối Poisson mô hình hóa số lần xuất hiện của một biến cố trong một khung thời gian/không gian xác định với tốc độ trung bình $\\lambda$.", "multiple": false}, {"id": "w06_q006", "week": 6, "topic": "Tính chất hàm CDF", "difficulty": "easy", "question": "Giới hạn của hàm phân phối tích lũy $F_{X}(x)$ khi x tiến ra -∞ và +∞ lần lượt là bao nhiêu?", "options": ["A. -1 và +1", "B. 0 và 1", "C. 0 và +∞", "D. -∞ và +∞"], "correct": [1], "explanation": "Theo tiên đề xác suất: lim_{x -> -∞} F(x) = 0 và lim_{x -> +∞} F(x) = 1.", "multiple": false}, {"id": "w06_q007", "week": 6, "topic": "Python / scipy.stats", "difficulty": "easy", "question": "Trong thư viện scipy.stats của Python, hàm nào dùng để tính xác suất tại một điểm P(X = k) của phân phối nhị thức?", "options": ["A. binom.cdf(k, n, p)", "B. binom.pmf(k, n, p)", "C. binom.mean(n, p)", "D. binom.rvs(n, p)"], "correct": [1], "explanation": "Với biến ngẫu nhiên rời rạc, hàm `pmf` (probability mass function) tính P(X = k), còn hàm `cdf` tính P(X ≤ k).", "multiple": false}, {"id": "w06_q008", "week": 6, "topic": "Phân phối Đều rời rạc", "difficulty": "easy", "question": "Tung một con xúc xắc 6 mặt cân đối. Biến ngẫu nhiên X biểu thị số chấm xuất hiện tuân theo phân phối gì và P(X = 4) bằng bao nhiêu?", "options": ["A. Phân phối Nhị thức; P(X = 4) = 4/6", "B. Phân phối Đều rời rạc (Discrete Uniform); P(X = 4) = 1/6", "C. Phân phối Poisson; P(X = 4) = e^(-4)", "D. Phân phối Bernoulli; P(X = 4) = 0.5"], "correct": [1], "explanation": "Mỗi mặt từ 1 đến 6 có cơ hội xuất hiện như nhau (1/6), đây là phân phối đều rời rạc trên tập {1, 2, 3, 4, 5, 6}.", "multiple": false}, {"id": "w06_q009", "week": 6, "topic": "Định nghĩa Biến ngẫu nhiên", "difficulty": "easy", "question": "Về mặt toán học, Biến ngẫu nhiên (Random Variable) thực chất là gì?", "options": ["A. Một số ngẫu nhiên thay đổi liên tục.", "B. Một hàm số (ánh xạ) gán mỗi kết cục trong không gian mẫu Ω với một số thực.", "C. Một cột dữ liệu trong file Excel.", "D. Một phương trình không có nghiệm."], "correct": [1], "explanation": "Định nghĩa toán học: Biến ngẫu nhiên X là một ánh xạ đo được từ không gian mẫu Ω vào tập số thực ℝ: X: Ω → ℝ.", "multiple": false}, {"id": "w06_q010", "week": 6, "topic": "Tính xác suất từ CDF", "difficulty": "medium", "question": "Cho biến ngẫu nhiên rời rạc X có hàm phân phối tích lũy $F_{X}(x)$. Để tính xác suất P(a < X ≤ b) với a < b, ta dùng công thức nào?", "options": ["A. $F_{X}(b)$ + $F_{X}(a)$", "B. $F_{X}(b)$ - $F_{X}(a)$", "C. $F_{X}(b)$ * $F_{X}(a)$", "D. 1 - F_X(b - a)"], "correct": [1], "explanation": "P(a < X ≤ b) = P(X ≤ b) - P(X ≤ a) = $F_{X}(b)$ - $F_{X}(a)$.", "multiple": false}, {"id": "w06_q011", "week": 6, "topic": "Phân phối Nhị thức: Công thức PMF", "difficulty": "medium", "question": "Một bài thi trắc nghiệm có 10 câu hỏi độc lập, mỗi câu có 4 phương án và chỉ có 1 phương án đúng. Một học sinh chọn ngẫu nhiên hoàn toàn. Xác suất để học sinh làm đúng chính xác 3 câu là bao nhiêu?", "options": ["A. $\\left(\\frac{1}{4}\\right)^{3}$ * (3/4)⁷", "B. $\\binom{10}{3}  (0.25)³ \\times (0.75)⁷$", "C. $3/10 = 0.3$", "D. $\\binom{10}{3}  (0.25)⁷ \\times (0.75)³$"], "correct": [1], "explanation": "Số câu đúng X ~ Bin($n = 10$, $p = 0.25$). Công thức PMF: P(X = 3) = $\\binom{10}{3}  (0.25)³ \\times (0.75)⁷ ≈ 0.2503.$", "multiple": false}, {"id": "w06_q012", "week": 6, "topic": "So sánh Nhị thức vs Siêu bội", "difficulty": "medium", "question": "Sự khác biệt cốt lõi nhất giữa Phân phối Nhị thức (Binomial) và Phân phối Siêu bội (Hypergeometric) là gì?", "options": ["A. Nhị thức dùng cho biến liên tục, Siêu bội dùng cho biến rời rạc.", "B. Nhị thức áp dụng cho các phép thử ĐỘC LẬP (ví dụ: rút có hoàn lại, xác suất p không đổi); Siêu bội áp dụng cho rút KHÔNG HOÀN LẠI từ quần thể hữu hạn (các lần rút phụ thuộc nhau).", "C. Siêu bội luôn có phương sai lớn hơn Nhị thức.", "D. Nhị thức chỉ dùng khi cỡ mẫu $n = 2$."], "correct": [1], "explanation": "Rút có hoàn lại -> độc lập -> Nhị thức. Rút không hoàn lại từ tập hữu hạn -> phụ thuộc, xác suất thay đổi sau mỗi lần rút -> Siêu bội.", "multiple": false}, {"id": "w06_q013", "week": 6, "topic": "Phân phối Siêu bội tính toán", "difficulty": "medium", "question": "Một hội đồng có 12 người gồm 7 Nam và 5 Nữ. Chọn ngẫu nhiên không hoàn lại 4 người vào ban thư ký. Xác suất để ban thư ký có chính xác 2 Nữ là bao nhiêu?", "options": ["A. $\\frac{\\binom{5}{2} \\times \\binom{7}{2}}{\\binom{12}{4}}$", "B. $\\binom{4}{2}  \\left(\\frac{5}{12}\\right)^{2} \\times \\left(\\frac{7}{12}\\right)^{2}$", "C. $\\frac{\\binom{5}{2} + \\binom{7}{2}}{\\binom{12}{4}}$", "D. $2/4 = 0.5$"], "correct": [0], "explanation": "Đây là phân phối Siêu bội: chọn 2 Nữ từ 5 Nữ và chọn 2 Nam từ 7 Nam trên tổng số cách chọn 4 người từ 12 người. P = $\\frac{\\binom{5}{2} \\times \\binom{7}{2}}{\\binom{12}{4}}$ = (10 * 21) / 495 = 210/495 ≈ 0.424.", "multiple": false}, {"id": "w06_q014", "week": 6, "topic": "Phân phối Poisson: Tính xác suất", "difficulty": "medium", "question": "Số lượng gói tin lỗi truyền qua kênh mạng trung bình là $\\lambda$ = 2 gói/phút, tuân theo phân phối Poisson. Xác suất trong một phút có chính xác 3 gói tin lỗi là bao nhiêu?", "options": ["A. (e^(-2) * $2^{3}$) / 3! = 8 * e^(-2) / 6 ≈ 0.1804", "B. (e^(-3) * $3^{2}$) / 2!", "C. $2^{3}$ / 3! = 8/6", "D. e^(-2) ≈ 0.1353"], "correct": [0], "explanation": "Công thức Poisson PMF: P(X = k) = e^(-$\\lambda$) *$\\lambda$^k / k!. Với$\\lambda$ = 2, $k = 3$: P(X = 3) = e^(-2) * $2^{3}$ / 3! = 8/(6 * $e^2$) ≈ 0.1804.", "multiple": false}, {"id": "w06_q015", "week": 6, "topic": "Phân phối Poisson: Xác suất bằng 0", "difficulty": "medium", "question": "Tiếp tục bài toán trên với $\\lambda$ = 2. Xác suất để trong một phút KHÔNG CÓ BẤT KỲ gói tin lỗi nào ($k = 0$) là bao nhiêu?", "options": ["A. 0", "B. e^(-2) ≈ 0.1353", "C. 1 - e^(-2)", "D. 0.5"], "correct": [1], "explanation": "P(X = 0) = e^(-$\\lambda$) *$\\lambda$^0 / 0! = e^(-2) * $1 / 1 =$e^(-2) ≈ 0.1353.", "multiple": false}, {"id": "w06_q016", "week": 6, "topic": "Tham số Poisson theo độ dài khoảng", "difficulty": "medium", "question": "Số yêu cầu đến máy chủ có tốc độ trung bình ổn định 2 yêu cầu/phút và được mô hình hóa bằng Poisson. Trong khoảng 3 phút, tham số $\\lambda$ của số yêu cầu là bao nhiêu?", "options": ["A. 2.", "B. 3.", "C. 5.", "D. 6."], "correct": [3], "explanation": "Tham số Poisson bằng tốc độ trung bình nhân độ dài khoảng quan sát: $\\lambda=2\\times3=6$ yêu cầu. Khi đổi khoảng thời gian, cần đổi tham số theo cùng tỷ lệ.", "multiple": false}, {"id": "w06_q017", "week": 6, "topic": "Đặc trưng hình bậc thang của CDF", "difficulty": "medium", "question": "Đồ thị hàm phân phối tích lũy $F_{X}(x)$ của một biến ngẫu nhiên RỜI RẠC có hình dạng gì?", "options": ["A. Một đường cong mượt mà hình chữ S.", "B. Một hàm hằng không đổi.", "C. Một đường bậc thang (Step function) tăng dần từ trái sang phải, với các bước nhảy xảy ra tại các điểm mà biến ngẫu nhiên có xác suất dương.", "D. Một đường thẳng dốc xuống."], "correct": [2], "explanation": "Với biến ngẫu nhiên rời rạc, CDF là hàm bậc thang gián đoạn tại các giá trị khả dĩ, độ cao của mỗi bước nhảy tại điểm x chính là xác suất P(X = x).", "multiple": false}, {"id": "w06_q018", "week": 6, "topic": "Độ cao bước nhảy của CDF", "difficulty": "medium", "question": "Cho biến ngẫu nhiên X có CDF thỏa mãn: F(2) = 0.65 và lim_{x -> 2^-} F(x) = 0.40. Xác suất P(X = 2) bằng bao nhiêu?", "options": ["A. 0.65", "B. 0.40", "C. 0.65 - 0.40 = 0.25", "D. 0.65 + 0.40 = 1.05"], "correct": [2], "explanation": "Độ cao của bước nhảy tại điểm x chính là xác suất tại điểm đó: P(X = 2) = F(2) - F(2^-) = 0.65 - 0.40 = 0.25.", "multiple": false}, {"id": "w06_q019", "week": 6, "topic": "Tham số của phân phối siêu bội", "difficulty": "medium", "question": "Một lô có 20 sản phẩm, trong đó 6 sản phẩm lỗi. Chọn ngẫu nhiên 5 sản phẩm không hoàn lại và gọi $X$ là số sản phẩm lỗi được chọn. Cách khai báo tham số nào của `scipy.stats.hypergeom` đúng theo thứ tự `(M, n, N)`?", "options": ["A. `(20, 6, 5)`.", "B. `(20, 14, 5)`.", "C. `(6, 20, 5)`.", "D. `(20, 5, 6)`."], "correct": [0], "explanation": "Trong tham số hóa này, $M$ là kích thước quần thể, $n$ là số phần tử thành công trong quần thể, và $N$ là cỡ mẫu. Có 20 sản phẩm, 6 sản phẩm lỗi và chọn 5 sản phẩm.", "multiple": false}, {"id": "w06_q020", "week": 6, "topic": "Python / scipy.stats: CDF", "difficulty": "medium", "question": "Cho X ~ Bin($n = 20$, $p = 0.3$). Lệnh Python nào tính xác suất có NHIỀU HƠN 5 lần thành công P(X > 5)?", "options": ["A. `binom.pmf(5, 20, 0.3)`", "B. `1 - binom.cdf(5, 20, 0.3)`", "C. `binom.cdf(5, 20, 0.3)`", "D. `1 - binom.cdf(4, 20, 0.3)`"], "correct": [1], "explanation": "P(X > 5) = 1 - P(X ≤ 5). Vì hàm `binom.cdf(5, n, p)` tính P(X ≤ 5), kết quả là `1 - binom.cdf(5, 20, 0.3)`.", "multiple": false}, {"id": "w06_q021", "week": 6, "topic": "Kiểm tra tính hợp lệ của PMF", "difficulty": "medium", "question": "Bảng nào sau đây xác định một hàm khối xác suất (PMF) HỢP LỆ cho biến ngẫu nhiên X nhận các giá trị {1, 2, 3}?", "options": ["A. P(X=1) = 0.3, P(X=2) = 0.4, P(X=3) = 0.4", "B. P(X=1) = 0.5, P(X=2) = -0.1, P(X=3) = 0.6", "C. P(X=1) = 0.2, P(X=2) = 0.5, P(X=3) = 0.3", "D. P(X=1) = 0.1, P(X=2) = 0.2, P(X=3) = 0.3"], "correct": [2], "explanation": "Chỉ có phương án C thỏa mãn cả 2 điều kiện: tất cả xác suất đều không âm (0.2, 0.5, 0.3 ≥ 0) và tổng của chúng bằng đúng 1.0 (0.2 + 0.5 + 0.3 = 1).", "multiple": false}, {"id": "w06_q022", "week": 6, "topic": "Tính xác suất ít nhất 1", "difficulty": "medium", "question": "Một bài thi trắc nghiệm gồm 4 câu, mỗi câu có xác suất đoán đúng độc lập là 0.25. Xác suất để đoán đúng ÍT NHẤT MỘT CÂU là bao nhiêu?", "options": ["A. 4 * 0.25 = 1.0", "B. 1 - (0.75)⁴ = 1 - 0.3164 ≈ 0.6836", "C. (0.25)⁴ ≈ 0.0039", "D. 0.25"], "correct": [1], "explanation": "P(X ≥ 1) = 1 - P(X = 0) = 1 - (1 - 0.25)⁴ = 1 - (0.75)⁴ = 1 - 81/256 ≈ 0.6836.", "multiple": false}, {"id": "w06_q023", "week": 6, "topic": "Python / numpy mô phỏng", "difficulty": "medium", "question": "Đoạn mã sau mô phỏng phép thử gì trong xác suất?\n```python\nrng = np.random.default_rng()\nsamples = rng.binomial(n=10, p=0.5, size=1000)\n```", "options": ["A. Tung 1 đồng xu 1000 lần.", "B. Lặp lại 1000 lần thí nghiệm tung 10 đồng xu cân đối, mỗi lần đếm số mặt ngửa xuất hiện.", "C. Chọn ngẫu nhiên 10 số từ 1 đến 1000.", "D. Tính tích phân phân phối chuẩn."], "correct": [1], "explanation": "`rng.binomial(n=10, p=0.5, size=1000)` sinh ra 1000 giá trị của biến ngẫu nhiên nhị thức Bin(10, 0.5).", "multiple": false}, {"id": "w06_q024", "week": 6, "topic": "Tính chất cộng của phân phối Poisson", "difficulty": "medium", "question": "Nếu X1 ~ Poisson($\\lambda$1) và X2 ~ Poisson($\\lambda$2) là hai biến ngẫu nhiên ĐỘC LẬP. Tổng Y = X1 + X2 sẽ tuân theo phân phối gì?", "options": ["A. Poisson($\\lambda$1 + $\\lambda$2)", "B. Poisson($\\lambda$1 * $\\lambda$2)", "C. Binomial($\\lambda$1 + $\\lambda$2)", "D. Phân phối Chuẩn N($\\lambda$1, $\\lambda$2)"], "correct": [0], "explanation": "Tính chất cộng của phân phối Poisson: Tổng của hai biến ngẫu nhiên Poisson độc lập là một biến ngẫu nhiên Poisson với tham số bằng tổng hai tham số $\\lambda$1 + $\\lambda$2.", "multiple": false}, {"id": "w06_q025", "week": 6, "topic": "Nhận diện mô hình", "difficulty": "medium", "question": "Số lượng xe cứu thương được gọi đến cấp cứu trong một ngày tại một thành phố lớn có đặc điểm: số dân rất đông, xác suất mỗi người cần cấp cứu rất nhỏ và các ca bệnh diễn ra độc lập. Phân phối nào sau đây là mô hình thích hợp nhất?", "options": ["A. Phân phối Đều rời rạc", "B. Phân phối Poisson", "C. Phân phối Bernoulli", "D. Phân phối Siêu bội với N = 10"], "correct": [1], "explanation": "Hiện tượng số ca biến cố hiếm xảy ra độc lập trong quần thể lớn với tốc độ trung bình ổn định là tình huống điển hình của phân phối Poisson.", "multiple": false}, {"id": "w06_q026", "week": 6, "topic": "Phân phối của tổng hai xúc xắc", "difficulty": "hard", "question": "Gieo hai xúc xắc sáu mặt cân đối và phân biệt. Gọi $S$ là tổng số chấm. Xác suất $P(S=7)$ bằng bao nhiêu?", "options": ["A. $1/6$.", "B. $1/12$.", "C. $1/36$.", "D. $7/36$."], "correct": [0], "explanation": "Có 36 cặp kết quả có thứ tự đồng khả năng. Tổng bằng 7 ở 6 cặp: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). Do đó $P(S=7)=6/36=1/6$. Đây là dạng bài trong bài tập tuần 06.", "multiple": false}, {"id": "w06_q027", "week": 6, "topic": "Hàm khối xác suất có điều kiện", "difficulty": "hard", "question": "Cho X ~ Poisson($\\lambda$ = 4). Tính xác suất có điều kiện P(X = 1 | X ≤ 2)?", "options": ["A. P(X = 1) / [P(X = 0) + P(X = 1) + P(X = 2)] = (4*e^(-4)) / [e^(-4)*(1 + 4 + 8)] = 4/13 ≈ 0.3077", "B. 4/10", "C. e^(-4) / 2", "D. 1/3"], "correct": [0], "explanation": "P(X = 1 | X ≤ 2) = P(X = 1) / P(X ≤ 2). Ta có: P(X=0) = e^(-4), P(X=1) = 4*e^(-4), P(X=2) = ($4^{2}$/2!)*e^(-4) = 8*e^(-4). Tổng P(X ≤ 2) = 13*e^(-4). Tỷ lệ = 4 / 13 ≈ 0.3077.", "multiple": false}, {"id": "w06_q028", "week": 6, "topic": "Tham số k của Phân phối Siêu bội", "difficulty": "hard", "question": "Trong phân phối Siêu bội Hypergeom(N, K, n), giá trị k (số lượng cá thể đặc biệt trong mẫu) bị giới hạn trong khoảng nào?", "options": ["A. 0 ≤ k ≤ n", "B. max(0, n - (N - K)) ≤ k ≤ min(n, K)", "C. 0 ≤ k ≤ K", "D. 0 ≤ k ≤ N"], "correct": [1], "explanation": "Số thành công k không thể vượt quá tổng số có sẵn K và cũng không thể vượt quá kích thước mẫu rút n (k ≤ min(n, K)). Đồng thời số phần tử không thành công n - k không vượt quá N - K, dẫn đến k ≥ max(0, n - (N - K)).", "multiple": false}, {"id": "w06_q029", "week": 6, "topic": "Phân phối của giá trị lớn nhất hai xúc xắc", "difficulty": "hard", "question": "Gieo độc lập hai xúc xắc sáu mặt cân đối. Gọi $M$ là giá trị lớn nhất trong hai kết quả. Giá trị của $P(M\\leq 3)$ là bao nhiêu?", "options": ["A. $1/4$.", "B. $1/3$.", "C. $1/2$.", "D. $3/4$."], "correct": [0], "explanation": "Để $M\\leq3$, cả hai xúc xắc đều phải cho kết quả thuộc {1,2,3}. Xác suất là $(3/6)^2=1/4$. Đây là bài toán lập phân phối của giá trị lớn nhất trong bài tập tuần 06.", "multiple": false}, {"id": "w06_q030", "week": 6, "topic": "Tính liên tục phải của CDF", "difficulty": "hard", "question": "Tại sao hàm phân phối tích lũy $F_{X}(x)$ luôn liên tục PHẢI (right-continuous) chứ không phải liên tục trái theo định nghĩa chuẩn?", "options": ["A. Do quy ước sử dụng dấu '≤' trong F(x) = P(X ≤ x). Khi dãy x_n giảm dần về x (tiến từ bên phải), biến cố {X ≤ x_n} hội tụ giảm về {X ≤ x}.", "B. Do phần mềm máy tính chỉ hỗ trợ số dương.", "C. Do các bước nhảy chỉ xảy ra ở số âm.", "D. Đây là một định lý ngẫu nhiên không có chứng minh."], "correct": [0], "explanation": "Vì F(x) = P(X ≤ x), tính liên tục của độ đo xác suất trên các dãy biến cố giảm dần đảm bảo lim_{$\\varepsilon$ -> 0^+} F(x + $\\varepsilon$) = F(x).", "multiple": false}, {"id": "w06_q031", "week": 6, "topic": "Chuẩn hóa một hàm khối xác suất", "difficulty": "hard", "question": "Một biến ngẫu nhiên rời rạc $Y$ nhận các giá trị 1, 2, 3, 4, 5 với $P(Y=y)=ky$. Giá trị nào của $k$ làm cho đây là một PMF hợp lệ?", "options": ["A. $1/5$.", "B. $1/10$.", "C. $1/15$.", "D. $1/25$."], "correct": [2], "explanation": "Tổng xác suất phải bằng 1: $k(1+2+3+4+5)=15k=1$, do đó $k=1/15$. Đồng thời các xác suất đều không âm.", "multiple": false}, {"id": "w06_q032", "week": 6, "topic": "Biến ngẫu nhiên là hàm số", "difficulty": "hard", "question": "Cho biến ngẫu nhiên X nhận các giá trị {-1, 0, 1} với xác suất tương ứng {0.2, 0.5, 0.3}. Xét biến ngẫu nhiên mới $Y = X^2$. Hàm khối xác suất $p_{Y}(y)$ của Y là:", "options": ["A. $p_{Y}(0) = 0.5$; $p_{Y}(1) = 0.5$", "B. $p_{Y}(0) = 0.5$; $p_{Y}(1) = 0.3$; $p_{Y}(-1) = 0.2$", "C. $p_{Y}(1) = 0.04$; $p_{Y}(0) = 0.25$", "D. $p_{Y}(0) = 0.25$; $p_{Y}(1) = 0.75$"], "correct": [0], "explanation": "$Y = X^2$ chỉ nhận 2 giá trị: $y = 0$ (khi X = 0, xác suất 0.5) và $y = 1$ (khi X = -1 hoặc X = 1, xác suất 0.2 + 0.3 = 0.5). Do đó $p_{Y}(0) = 0.5$ và $p_{Y}(1) = 0.5.$", "multiple": false}, {"id": "w06_q033", "week": 6, "topic": "Mô phỏng lấy mẫu có hoàn lại vs không hoàn lại", "difficulty": "hard", "question": "Trong bài giảng Tuần 06, đoạn code `rng.choice([1, 2, 2, 3, 4], size=50, replace=False)` sẽ gặp lỗi nếu tham số `size` được đặt là bao nhiêu?", "options": ["A. size = 1", "B. size = 5", "C. size = 6 (hoặc bất kỳ giá trị nào lớn hơn 5)", "D. Không bao giờ báo lỗi."], "correct": [2], "explanation": "Với `replace=False` (rút không hoàn lại), kích thước mẫu rút không thể vượt quá số lượng phần tử có sẵn trong danh sách (ở đây là 5 phần tử). Nếu size > 5, NumPy sẽ quăng lỗi ValueError: Cannot take a larger sample than population when 'replace=False'.", "multiple": false}, {"id": "w06_q034", "week": 6, "topic": "Phân phối đều rời rạc", "difficulty": "hard", "question": "Một số nguyên được chọn ngẫu nhiên với xác suất bằng nhau từ tập $\\{1,2,\\ldots,10\\}$. Gọi $X$ là số được chọn. Xác suất $P(3\\leq X\\leq7)$ bằng bao nhiêu?", "options": ["A. $0.3$.", "B. $0.4$.", "C. $0.5$.", "D. $0.7$."], "correct": [2], "explanation": "Có 5 giá trị thuận lợi (3, 4, 5, 6, 7) trong tổng số 10 giá trị đồng khả năng, nên xác suất là $5/10=0.5$. Đây là dạng phân phối đều rời rạc trong bài tập tuần 06.", "multiple": false}, {"id": "w06_q035", "week": 6, "topic": "Hội tụ tần suất thực nghiệm", "difficulty": "hard", "question": "Mô phỏng rút thăm 50 lần, 500 lần và 5.000 lần trong bài giảng cho thấy: tần suất thực nghiệm của số 2 lần lượt là 0.34 (ở m=50), 0.402 (ở m=500), và 0.394 (ở m=5000), trong khi xác suất lý thuyết là 0.400. Phát biểu nào sau đây là CHUẨN XÁC NHẤT?", "options": ["A. Cứ mỗi lần tăng cỡ mẫu, sai số tuyệt đối chắc chắn sẽ giảm đơn điệu.", "B. Khi cỡ mẫu m tăng lớn, tần suất có XU HƯỚNG tiến gần về xác suất lý thuyết (Luật số lớn), nhưng không đảm bảo sai số giảm sau mỗi bước nhảy cỡ mẫu đơn lẻ do có sự dao động ngẫu nhiên.", "C. Mô phỏng của Python bị lỗi làm tròn số.", "D. Cần lặp lại vô hạn lần thì mới tính được tần suất."], "correct": [1], "explanation": "Luật số lớn là định lý giới hạn tiệm cận (hội tụ theo xác suất / hầu chắc chắn). Trên từng mẫu ngẫu nhiên cụ thể, sự dao động ngẫu nhiên có thể khiến sai số ở 5000 lần hơi lớn hơn 500 lần một chút, nhưng xu hướng tổng thể là ngày càng bám sát lý thuyết.", "multiple": false}, {"id": "w07_q001", "week": 7, "topic": "Tính tuyến tính của Kỳ vọng", "difficulty": "easy", "question": "Cho biến ngẫu nhiên X có kỳ vọng $E(X)$ = 10. Kỳ vọng của biến Y = 3X + 5 là bao nhiêu?", "options": ["A. 30", "B. 35", "C. 15", "D. 50"], "correct": [1], "explanation": "Tính tuyến tính của kỳ vọng: $E(aX + b)$ = a*$E(X)$ + b. Thay số: $E(3X + 5)$ = 3*10 + 5 = 35.", "multiple": false}, {"id": "w07_q002", "week": 7, "topic":
